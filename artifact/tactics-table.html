  .etab-btn{ display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border:none; border-radius:50%; background:none; color:var(--parchment-faint); padding:0; }
  .etab-btn:hover{ background:var(--line); color:var(--parchment); }
  .etab-add{ border:1px dashed var(--line); width:30px; height:30px; flex-shrink:0; }

  /* ===== prep mode ===== */
  .prep{ display:flex; flex-direction:column; gap:18px; }
  .setup-card{ display:flex; align-items:center; gap:22px; padding:20px 22px; flex-wrap:wrap; }
  .setup-card h2{ font-size:20px; font-weight:700; margin:0 0 3px; }
  .setup-intro{ flex:1 1 220px; min-width:200px; }
  .steps{ display:flex; gap:10px; flex-wrap:wrap; }
  .step{ display:flex; align-items:center; gap:10px; padding:7px 16px 7px 7px; border:1px solid var(--line); border-radius:999px; background:var(--panel-raised); color:var(--parchment); font-size:14px; font-weight:600; text-align:left; }
  .step:hover{ border-color:var(--parchment-faint); }
  .step-num{ width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-size:13px; font-weight:700; background:var(--line); color:var(--parchment-dim); flex-shrink:0; }
  .step.done .step-num{ background:var(--moss); color:#0d0f13; }
  .step small{ display:block; color:var(--parchment-dim); font-size:12.5px; font-weight:400; }
  .prep-grid{ display:grid; grid-template-columns:minmax(0,5fr) minmax(0,6fr); gap:18px; align-items:start; }
  @media (max-width:1000px){ .prep-grid{ grid-template-columns:1fr; } }
  .roster{ display:flex; flex-direction:column; gap:10px; }
  .roster-row{ border:1px solid var(--line); border-radius:10px; background:var(--panel-raised); }
  .roster-row.absent{ opacity:.55; }
  .roster-main{ display:flex; align-items:center; gap:10px; padding:10px 12px; flex-wrap:wrap; }
  .roster-name{ order:1; flex:1 1 160px; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .roster-main > .iconbtn:first-child{ order:0; }
  .inline-input{ background:transparent; border:1px solid transparent; border-radius:6px; color:inherit; font:inherit; padding:3px 6px; width:100%; min-width:0; }
  .inline-input:hover{ border-color:var(--line); }
  .inline-input:focus{ border-color:var(--accent); background:var(--ink); outline:none; }
  .roster-name .inline-input.title{ font-weight:650; font-size:16px; color:var(--parchment); }
  .roster-name .inline-input.sub{ color:var(--parchment-dim); font-size:13px; }
  .stat-fields{ order:3; flex:1 0 100%; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
  .stat-field{ display:flex; flex-direction:column; gap:3px; }
  .stat-field > span{ font-size:11px; font-weight:600; color:var(--parchment-faint); text-transform:uppercase; letter-spacing:.05em; text-align:center; }
  .stat-field input{ width:62px; text-align:center; padding:6px 4px; border:1px solid var(--line); background:var(--ink); border-radius:8px; color:var(--parchment); font:inherit; font-size:14.5px; }
  .row-actions{ order:2; display:flex; align-items:center; gap:4px; margin-left:auto; }
  .row-expand{ border-top:1px solid var(--line-soft); padding:14px 14px 16px; background:var(--panel); border-radius:0 0 10px 10px; }
  .iconbtn{ display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; border:1px solid transparent; border-radius:8px; background:none; color:var(--parchment-dim); padding:0; }
  .iconbtn:hover{ background:var(--panel); border-color:var(--line); color:var(--parchment); }
  .iconbtn.danger:hover{ color:var(--blood-text); border-color:color-mix(in srgb, var(--blood) 50%, transparent); background:var(--blood-soft); }
  .iconbtn.on{ color:var(--moss); background:var(--moss-soft); border-color:color-mix(in srgb, var(--moss) 45%, transparent); }
  .team-toggle{ display:inline-flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; flex-shrink:0; }
  .team-toggle button{ border:none; background:none; color:var(--parchment-dim); padding:4px 11px; font-size:12.5px; font-weight:600; }
  .team-toggle button.on-enemy{ background:var(--blood-soft); color:var(--blood-text); }
  .team-toggle button.on-ally{ background:var(--moss-soft); color:var(--moss); }

  /* ===== run mode ===== */
  .turnbar{ display:flex; align-items:center; gap:22px; padding:16px 22px; flex-wrap:wrap; margin-bottom:18px; }
  .turnbar-round b{ display:block; font-size:34px; font-weight:700; line-height:1; font-variant-numeric:tabular-nums; }
  .turnbar-label{ display:block; font-size:11.5px; font-weight:600; letter-spacing:.07em; text-transform:uppercase; color:var(--parchment-faint); margin-bottom:3px; }
  .turnbar-now{ flex:1 1 220px; min-width:200px; }
  .turnbar-now b{ display:flex; align-items:center; gap:10px; font-size:24px; font-weight:700; line-height:1.15; }
  .turnbar-actions{ display:flex; align-items:center; gap:8px; margin-left:auto; flex-wrap:wrap; }
  .kind-dot{ width:10px; height:10px; border-radius:50%; background:var(--c, var(--line)); flex-shrink:0; }
  .plan-strip{ margin-bottom:18px; }
  .difficulty{ --dc:var(--parchment-faint); --dct:var(--parchment-dim); display:inline-flex; align-items:center; gap:12px; padding:9px 18px 9px 14px; border-radius:14px; border:2px solid var(--dc); background:color-mix(in srgb, var(--dc) 15%, transparent); color:var(--dct); cursor:help; }
  .difficulty-dot{ width:14px; height:14px; border-radius:50%; background:var(--dc); box-shadow:0 0 0 4px color-mix(in srgb, var(--dc) 25%, transparent); flex-shrink:0; }
  .difficulty-text{ display:flex; flex-direction:column; line-height:1.1; }
  .difficulty-text small{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85; }
  .difficulty-text b{ font-size:22px; font-weight:800; letter-spacing:.01em; margin-top:2px; }
  .difficulty-trivial{ --dc:var(--arcane); --dct:var(--arcane-text); }
  .difficulty-low{ --dc:var(--moss); --dct:var(--moss); }
  .difficulty-moderate{ --dc:var(--amber); --dct:var(--amber-text); }
  .difficulty-high{ --dc:var(--blood); --dct:var(--blood-text); }
  .top-drops{ display:flex; flex-direction:column; gap:10px; }
  .top-drops .plan-strip{ margin-bottom:0; }
  .run > .top-drops, .shell > div > .top-drops{ margin-bottom:0; }
  .plan-grid{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; padding:2px 20px 18px; }
  @media (max-width:900px){ .plan-grid{ grid-template-columns:1fr; } }
  .plan-item{ border-left:3px solid var(--c); padding:2px 0 2px 12px; }
  .plan-item b{ display:block; font-size:15px; }
  .plan-item small{ display:block; color:var(--parchment-faint); font-size:11.5px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; margin-bottom:2px; }
  .plan-item p{ margin:4px 0 0; font-size:13.5px; color:var(--parchment-dim); line-height:1.5; }
  .run{ display:grid; grid-template-columns:340px minmax(0,1fr); gap:18px; align-items:start; }
  @media (max-width:960px){ .run{ grid-template-columns:1fr; } }
  .rail{ padding:8px; display:flex; flex-direction:column; gap:4px; }
  .rail-head{ display:flex; align-items:center; justify-content:space-between; padding:8px 8px 6px; }
  .rail-head h2{ font-size:13px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--parchment-faint); margin:0; }
  .rail-row{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:11px; align-items:center; padding:10px 12px 10px 10px; border-radius:10px; border:1px solid transparent; cursor:pointer; position:relative; }
  .rail-row:hover{ background:var(--panel-raised); }
  .rail-row.selected{ background:var(--panel-raised); border-color:var(--line); }
  .rail-row.active{ background:color-mix(in srgb, var(--c) 13%, var(--panel)); border-color:var(--c); box-shadow:0 0 0 1px var(--c); }
  .rail-row.active.selected{ background:color-mix(in srgb, var(--c) 18%, var(--panel)); }
  .rail-init{ width:40px; height:36px; text-align:center; border-radius:9px; border:1px solid var(--line); background:var(--ink); color:var(--parchment); font-weight:700; font-size:15px; font-family:'IBM Plex Mono', monospace; padding:0; }
  .rail-init:hover{ border-color:var(--parchment-faint); }
  .rail-row.active .rail-init{ background:var(--c); border-color:var(--c); color:#0d0f13; }
  .rail-name{ display:flex; align-items:center; gap:8px; font-weight:650; font-size:15.5px; min-width:0; }
  .rail-name span.t{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rail-turn{ font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--c); flex-shrink:0; }
  .rail-meta{ display:flex; align-items:center; gap:9px; margin-top:6px; min-height:16px; }
  .rail-hp{ height:6px; flex:1; background:var(--line-soft); border-radius:99px; overflow:hidden; min-width:40px; }
  .rail-hp > div{ height:100%; border-radius:99px; transition:width .25s ease; }
  .rail-hp-num{ font-size:12.5px; color:var(--parchment-dim); font-family:'IBM Plex Mono', monospace; white-space:nowrap; }
  .rail-hp-num.down{ color:var(--blood-text); font-weight:700; }
  .cond-dots{ display:flex; gap:3px; }
  .cond-dots i{ width:8px; height:8px; border-radius:50%; background:var(--c); display:block; }
  .rail-section{ padding:10px 10px 4px; }
  .rail-defeated{ display:flex; align-items:center; gap:8px; padding:6px 8px; font-size:14px; color:var(--parchment-dim); }
  .rail-defeated .t{ flex:1; text-decoration:line-through; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .focus{ overflow:hidden; }
  .focus.is-active{ border-color:var(--c); box-shadow:var(--shadow), 0 0 0 1px var(--c); }
  .focus-head{ padding:22px 24px 18px; display:flex; gap:18px; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; }
  .focus-name{ font-size:28px; font-weight:700; margin:0; line-height:1.15; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .focus-sub{ color:var(--parchment-dim); font-size:15px; margin:5px 0 0; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .focus-stats{ display:flex; gap:10px; }
  .big-stat{ min-width:70px; padding:9px 12px 8px; border:1px solid var(--line); border-radius:10px; background:var(--panel-raised); text-align:center; }
  .big-stat b{ display:block; font-size:23px; font-weight:700; line-height:1.1; }
  .big-stat span{ display:block; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--parchment-faint); margin-top:2px; }
  .focus-section{ padding:18px 24px; border-top:1px solid var(--line-soft); }
  .focus-section-title{ font-size:12px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--parchment-faint); margin:0 0 10px; }
  .focus-actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .focus .condition-row{ margin-top:0; }
  .focus .condition-picker{ bottom:auto; top:100%; margin:6px 0 0; }
  .hp-panel{ display:flex; flex-direction:column; gap:12px; }
  .hp-big{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
  .hp-big-num{ font-size:44px; font-weight:700; line-height:1; }
  .hp-big-max{ font-size:18px; color:var(--parchment-dim); }
  .hp-meter{ height:14px; background:var(--line-soft); border-radius:99px; overflow:hidden; }
  .hp-meter > div{ height:100%; border-radius:99px; transition:width .25s ease; }
  .hp-actions{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hp-actions .amount{ width:130px; font-size:17px; padding:9px 12px; text-align:center; }
  .hp-edit{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .hp-edit .text-input{ width:84px; text-align:center; }
  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin:0 0 16px; }
  .tab{ padding:10px 16px; border:none; background:none; color:var(--parchment-dim); font-weight:600; font-size:15px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab:hover{ color:var(--parchment); }
  .tab.active{ color:var(--parchment); border-bottom-color:var(--accent); }
  .detail-quick{ display:flex; gap:14px; flex-wrap:wrap; align-items:center; margin-bottom:12px; font-size:14px; color:var(--parchment-dim); }
  .lookup-btn{ display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--accent-text); text-decoration:none; }
  .lookup-btn:hover{ text-decoration:underline; }

  /* ===== shared form bits ===== */
  .axes-strip{ margin:0; }
  .axes-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; flex-wrap:wrap;}
  .axes-head h2{font-size:15px; font-weight:600; margin:0; color:var(--parchment); display:flex; align-items:center; gap:7px;}
  .axes-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media (max-width:900px){ .axes-grid{grid-template-columns:1fr;} }
  .axis-card{padding:14px 16px; background:var(--panel-raised);}
  .axis-card.axis-locked{border-style:dashed;}
  .icon-btn.lock-active{color:var(--amber);}
  .icon-btn[disabled]{opacity:.35; cursor:not-allowed;}
  .axis-eyebrow{display:flex; align-items:center; gap:5px; margin-bottom:6px;}
  .axis-title{font-size:15.5px; font-weight:650; color:var(--parchment); margin:0;}
  .axis-desc{font-size:14px; color:var(--parchment-dim); margin-top:4px; line-height:1.5;}
  .axis-note{font-size:13.5px; margin-top:8px; line-height:1.5; font-style:normal; padding-left:10px; border-left:2px solid var(--c, var(--line));}
  .axis-badge{font-size:12px; padding:2px 9px; border:1px solid var(--c, var(--line)); color:var(--c, var(--parchment-dim)); border-radius:999px; flex-shrink:0;}

  .init-input{ width:44px; background:var(--ink); border:1px solid var(--line); color:inherit; font-family:inherit; font-size:14px; text-align:center; padding:4px; border-radius:8px; }
  .init-label.wide{ flex:1 1 auto; min-width:110px; }
  .init-label.wide span{ white-space:nowrap; }
  .ally-badge{ font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--moss); background:var(--moss-soft); border:1px solid color-mix(in srgb, var(--moss) 40%, transparent); border-radius:999px; padding:2px 9px; flex-shrink:0; }
  .ally-banner{ display:flex; align-items:center; gap:8px; padding:9px 12px; margin-bottom:10px; background:var(--moss-soft); border:1px solid color-mix(in srgb, var(--moss) 30%, transparent); border-radius:8px; font-size:13.5px; color:var(--moss); }

  .link-icon{color:var(--parchment-faint); flex-shrink:0; display:inline-flex;}
  .link-icon:hover{color:var(--arcane);}
  .icon-btn{color:var(--parchment-faint); background:none; border:none; padding:3px; display:inline-flex; border-radius:6px;}
  .icon-btn:hover{color:var(--blood);}

  .disclosure{ border-top:1px solid var(--line-soft); }
  .disclosure-toggle{
    width:100%; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:10px; font-size:14px; color:var(--parchment-dim); background:none; border:none; border-radius:8px;
  }
  .disclosure-toggle:hover{ color:var(--parchment); }
  .disclosure-body{ padding:0 0 4px; display:flex; flex-direction:column; gap:8px; }

  .field{padding:9px 14px;}
  .field label{display:block; font-size:12px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--parchment-faint); margin-bottom:4px;}
  .text-input{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--parchment);
    font-size:14.5px; padding:8px 11px; font-family:inherit; border-radius:8px;
  }
  .text-input:focus{ border-color:var(--accent); outline:none; box-shadow:0 0 0 3px var(--accent-soft); }
  .text-input::placeholder{color:var(--parchment-faint);}
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }
  .add-btn{
    display:flex; align-items:center; justify-content:center; gap:7px; border:1px solid var(--accent); background:var(--accent); border-radius:8px;
    color:var(--accent-ink); font-size:14px; font-weight:600; padding:9px 16px; transition:filter .15s;
  }
  .add-btn:hover{filter:brightness(1.1);}
  .add-btn[disabled]{opacity:.35; cursor:not-allowed;}

  /* hp bar (compact, used by player view) */
  .hp-bar-wrap{display:flex; align-items:center; gap:8px; width:100%;}
  .hp-end-label{font-size:12px; font-weight:700; flex-shrink:0; min-width:18px; color:var(--parchment-dim);}
  .hp-end-label.left{text-align:right;}
  .hp-end-label.right{text-align:left; color:var(--parchment-faint);}
  .hp-track{flex:1; min-width:0; height:8px; background:var(--line-soft); position:relative; overflow:hidden; border-radius:99px;}
  .hp-fill{height:100%; transition:width .25s ease; border-radius:99px;}
  .stepper{
    display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:8px; font-size:16px;
    border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-dim); flex-shrink:0;
    transition:border-color .15s, color .15s;
  }
  .stepper:hover{border-color:var(--parchment-faint); color:var(--parchment);}
  .ac-badge{display:flex; align-items:center; gap:5px; font-size:14px; color:var(--parchment-dim); flex-shrink:0;}
  .posture-chip{ font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; border:1px solid var(--c); color:var(--c); background:var(--c-soft); flex-shrink:0; white-space:nowrap; }
  .init-label{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .init-label span{font-size:11.5px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--parchment-faint);}
  .chevron{ color:var(--parchment-faint); transition:transform .15s; flex-shrink:0; }
  .chevron.open{ transform:rotate(90deg); }

  .abl-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; margin:10px 0; background:var(--line-soft);}
  .abl-cell{ background:var(--panel); text-align:center; padding:5px 2px; border:none; font:inherit; width:100%; }
  .abl-cell.rollable{ cursor:pointer; transition:background .12s; }
  .abl-cell.rollable:hover{ background:var(--panel-raised); }
  .abl-cell.rollable:active{ background:var(--line-soft); }
  .abl-cell .k{font-size:10.5px; font-weight:700; color:var(--parchment-faint); text-transform:uppercase;}
  .abl-cell .v{font-size:12.5px; color:var(--parchment); }
  .abl-grid.saves .abl-cell.proficient{ background:var(--arcane-soft); }
  .abl-grid.saves .abl-cell.proficient:hover{ background:rgba(79,168,154,.3); }
  .abl-grid.saves .abl-cell.proficient .k, .abl-grid.saves .abl-cell.proficient .v{ color:var(--arcane-text); font-weight:700; }
  .abl-roll-result{ font-size:12.5px; color:var(--parchment); margin:0 0 10px; padding:6px 10px; background:var(--panel-raised); border-left:2px solid var(--arcane); border-radius:0 4px 4px 0; }
  .abl-cell .v span{color:var(--parchment-faint);}

  .posture-row{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:4px;}
  .posture-btn{ border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-faint); font-size:12px; font-weight:600; letter-spacing:.03em; padding:6px 4px; text-align:center; }
  .posture-btn.active{border-color:var(--c); background:var(--c-soft); color:var(--c);}
  .posture-detail{border:1px solid var(--c); background:var(--c-soft); padding:10px 12px; margin-top:5px;}
  .axis-live-context{border:1px dashed var(--amber); background:var(--amber-soft); padding:8px 12px; margin-top:6px;}
  .axis-live-context p{font-size:12.5px; color:var(--amber-text); margin:2px 0;}
  .axis-live-context b{color:var(--amber-text);}
  .posture-detail p{font-size:13px; line-height:1.55; color:var(--parchment); margin:5px 0 0;}
  .posture-detail p:first-child{margin-top:0;}
  .posture-detail b{color:var(--parchment-dim); font-weight:600;}
  .tag-row{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px;}
  .tag{font-size:11px; border:1px solid var(--line); color:var(--parchment-dim); padding:1.5px 7px; border-radius:20px;}
  .condition-row{display:flex; flex-wrap:wrap; gap:5px; align-items:center; position:relative; margin-top:6px;}
  .condition-chip{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600; padding:3px 8px; border-radius:20px; border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-dim); transition:border-color .15s, background .15s, color .15s;}
  .condition-chip.active{border-color:var(--c, var(--amber)); background:color-mix(in srgb, var(--c, var(--amber)) 20%, transparent); color:var(--c, var(--amber-text));}
  .condition-chip.add{color:var(--parchment-faint); border-style:dashed;}
  .condition-chip.pickable:hover{border-color:var(--c); background:color-mix(in srgb, var(--c) 16%, transparent); color:var(--c);}
  .condition-dot{width:7px; height:7px; border-radius:50%; background:var(--c); flex-shrink:0;}
  /* "+ Condition" is the last element in a card, so opening this downward has nowhere to go but
     into whatever card sits below it in the column/list. Opening upward instead overlaps this
     same card's own content above (HP bar, etc.) rather than spilling into an unrelated neighbor. */
  .condition-picker{display:flex; flex-wrap:wrap; gap:5px; position:absolute; bottom:100%; left:0; margin-bottom:4px; padding:8px; background:var(--panel); border:1px solid var(--line); box-shadow:0 8px 24px -8px rgba(0,0,0,.5); z-index:5; width:max-content; max-width:260px;}
  .my-monsters-list{display:flex; flex-wrap:wrap; gap:5px; max-height:180px; overflow-y:auto; padding-right:2px;}
  .browse-results{display:flex; flex-direction:column; gap:3px; max-height:280px; overflow-y:auto; padding-right:2px;}
  .browse-row{display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; padding:6px 9px; border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-dim);}
  .browse-row:hover{border-color:var(--blood); background:var(--blood-soft); color:var(--parchment);}
  .browse-row-name{font-size:13px; font-weight:600; color:var(--parchment); flex-shrink:0;}
  .browse-row-meta{font-size:11px; color:var(--parchment-faint); text-align:right;}

  .section-label{display:flex; align-items:center; gap:5px; margin:13px 0 6px;}
  .section-label span{font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--parchment-faint);}
  .attack-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:13.5px; padding:2px 0;}
  .attack-name{color:var(--parchment); font-weight:500; flex-shrink:0;}
  .attack-stats{color:var(--parchment-dim); font-size:12.5px; text-align:right;}
  .spell-meta{font-size:11px; color:var(--parchment-faint); margin-left:auto; text-transform:none; letter-spacing:normal;}
  .spell-row{display:flex; align-items:baseline; gap:8px; font-size:13px; padding:2px 0;}
  .spell-freq{color:var(--parchment-dim); font-weight:600; flex-shrink:0; font-size:11.5px; white-space:nowrap;}
  .spell-names{color:var(--parchment);}
  .multiattack-badge{font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--blood-text); background:var(--blood-soft); border:1px solid rgba(178,60,55,.4); border-radius:20px; padding:2px 7px; margin-left:2px;}
  .multiattack-detail{font-size:12px; color:var(--parchment-dim); margin:2px 0 6px; padding:4px 10px; background:var(--blood-soft); border-left:2px solid rgba(178,60,55,.55); border-radius:0 4px 4px 0; line-height:1.4;}
  .multiattack-detail b{color:var(--blood-text); font-weight:700;}
  .multiattack-desc{font-size:11px; color:var(--parchment-faint); margin-top:3px; font-style:italic; line-height:1.35;}
  .name-suggest-list{position:absolute; top:calc(100% + 4px); left:0; right:0; z-index:30; display:flex; flex-direction:column; gap:2px;
    max-height:280px; overflow-y:auto; background:var(--panel-raised); border:1px solid var(--line); box-shadow:0 12px 24px -10px rgba(0,0,0,.6); padding:4px;}
  .name-suggest-row{display:flex; justify-content:space-between; align-items:center; gap:8px; width:100%; text-align:left; padding:6px 8px; border:none; background:transparent; color:var(--parchment-dim); cursor:pointer;}
  .name-suggest-row:hover{background:var(--blood-soft); color:var(--parchment);}
  .name-suggest-name{font-size:13px; font-weight:600; color:var(--parchment); flex-shrink:0;}
  .name-suggest-meta{font-size:11px; color:var(--parchment-faint); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .mob-count-badge{font-size:11px; font-weight:700; color:var(--amber-text); background:var(--amber-soft); border:1px solid rgba(255,182,39,.35); border-radius:20px; padding:1px 7px; flex-shrink:0;}
  .mob-count-row{display:flex; align-items:center; gap:8px;}
  .mob-count-label{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--parchment-faint);}
  .mob-count-row .init-input{width:44px;}
  .mob-attack{margin-top:16px; padding:14px; border-top:1px solid var(--line-soft); background:var(--panel-raised); border-radius:4px;}
  .mob-attack + .mob-attack{margin-top:14px; border-top:none;}
  .mob-attack-grid{display:grid; grid-template-columns:repeat(auto-fit, minmax(96px,1fr)); gap:10px 12px; margin-top:10px;}
  .mob-attack-field{display:flex; flex-direction:column; gap:4px; min-width:0;}
  .mob-attack-field.wide{grid-column:1 / -1;}
  .mob-attack-field label{font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--parchment-faint);}
  .mob-attack-subtitle{font-size:11.5px; font-weight:400; color:var(--parchment-faint); margin:-2px 0 0;}
  .mob-attack-row{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:12px;}
  .mob-attack-static{font-size:13px; color:var(--parchment); padding:7px 0;}
  .mob-attack-vs{font-size:11.5px; color:var(--parchment-faint); flex-shrink:0; white-space:nowrap;}
  .mob-attack-hint{font-size:12px; color:var(--parchment-dim); margin:12px 0 0; line-height:1.5;}
  .mob-attack-result{font-size:12.5px; color:var(--parchment); font-weight:600;}
  .mob-tool-header{cursor:pointer; user-select:none; margin-bottom:0;}
  .mob-tool-header:hover span{color:var(--parchment);}

  .callout{display:flex; align-items:flex-start; gap:6px; margin-top:11px;}
  .callout p{font-size:12.5px; line-height:1.5; color:var(--parchment-dim); margin:0;}
  .callout.reaction svg{color:var(--amber); margin-top:1px; flex-shrink:0;}
  .callout.passive svg{color:var(--parchment-faint); margin-top:1px; flex-shrink:0;}

  .trait-block{ border:1px solid var(--line); background:var(--ink); padding:10px 12px; margin-top:11px; }
  .trait-block .lbl{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--parchment-faint); display:block; margin-bottom:6px;}
  .trait-block p{font-size:13px; line-height:1.5; color:var(--parchment-dim); margin:6px 0 0;}
  .trait-block p:first-of-type{margin-top:0;}
  .trait-block b{color:var(--parchment); font-weight:600;}
  .trigger-dc{font-size:12px; color:var(--amber-text); margin-top:3px; display:block;}

  /* modal */
  .modal-veil{position:fixed; inset:0; background:var(--veil); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}
  .modal{width:100%; max-width:640px; background:var(--panel); border:1px solid var(--line); box-shadow:0 24px 60px -20px rgba(0,0,0,.5); max-height:90vh; overflow-y:auto;}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--line-soft); position:sticky; top:0; background:var(--panel);}
  .modal-head h2{font-size:15px; font-weight:600; letter-spacing:.05em; margin:0; display:flex; align-items:center; gap:7px; color:var(--parchment);}
  .modal-close{color:var(--parchment-faint);}
  .modal-close:hover{color:var(--parchment);}
  .modal-body{padding:14px 16px;}
  textarea{
    width:100%; height:200px; resize:vertical; background:var(--ink); border:1px solid var(--line);
    color:var(--parchment); font-size:13px; padding:10px; font-family:'IBM Plex Mono', monospace; line-height:1.5;
  }
  textarea::placeholder{color:var(--parchment-faint);}
  .error-box{display:flex; align-items:flex-start; gap:7px; border:1px solid rgba(178,60,55,.45); background:var(--blood-soft); padding:9px 11px; margin-top:11px;}
  .error-box svg{color:var(--blood); margin-top:1px; flex-shrink:0;}
  .error-box p{font-size:13px; line-height:1.5; color:var(--blood-text); margin:0;}
  .modal-foot{display:flex; justify-content:flex-end; gap:8px; padding:12px 16px; border-top:1px solid var(--line-soft); position:sticky; bottom:0; background:var(--panel);}

  .upload-drop{
    border:1.5px dashed var(--line); background:var(--ink); padding:20px; text-align:center; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:6px; color:var(--parchment-dim); font-size:13.5px;
  }
  .upload-drop:hover{ border-color:var(--arcane); color:var(--parchment); }
  .upload-drop.busy{ opacity:.6; cursor:wait; }
  .tab-row{display:flex; gap:4px; margin-bottom:10px;}
  .tab-btn{ flex:1; padding:7px; font-size:13px; font-weight:600; border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-faint); display:inline-flex; align-items:center; justify-content:center; gap:5px; }
  .tab-btn.active{ border-color:var(--arcane); background:var(--arcane-soft); color:var(--arcane); }


  .player-view-wrap{ max-width:760px; margin:0 auto; padding:32px 20px 60px; }
  .player-view-msg{ margin-top:60px; text-align:center; color:var(--parchment-dim); font-size:15px; }
  .player-view-header{ display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .player-view-title{ font-size:22px; font-weight:700; margin:0 0 2px; color:var(--parchment); }
  .player-view-round{ font-size:13px; color:var(--parchment-dim); margin:0; }
  .player-view-note-wrap{ margin-top:10px; }
  .player-view-note{ width:100%; height:44px; min-height:44px; font-family:inherit; font-size:12.5px; resize:vertical; }
  .player-view-note-status{ display:block; font-size:11px; color:var(--parchment-faint); margin-top:4px; }
  .player-view-note-status.error{ color:var(--blood-text); }
  .player-view-track{ display:flex; flex-direction:column; gap:10px; }
  .player-view-card{ padding:14px 16px; border:1.5px solid var(--line); transition:border-color .15s, box-shadow .15s; }
  .player-view-card.active{ border-color:var(--c); box-shadow:0 0 0 2px var(--c); }
  .player-view-card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:8px; }
  .player-view-card-name{ font-size:15px; font-weight:600; color:var(--parchment); display:flex; align-items:center; gap:8px; }
  .player-view-card-kind{ font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:2px 7px; border-radius:10px; }
  .player-view-card-kind.pc{ background:var(--arcane-soft); color:var(--arcane); }
  .player-view-card-kind.ally{ background:var(--moss-soft); color:var(--moss); }
  .player-view-card-kind.monster{ background:var(--blood-soft); color:var(--blood-text); }
  .player-view-conditions{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
</style>

ll prone."},{title:"Vent Eruption",initiativeCount:20,triggerEffect:"A geyser or steam vent blasts a 10-ft column. Creatures caught in it take 2d6 fire or bludgeoning damage and are pushed 10 ft away from it."},{title:"Swinging Blade",initiativeCount:20,triggerEffect:"A pendulum trap sweeps back across its arc. Creatures in its path make a DC 13 Dexterity save, taking 2d8 slashing damage on a failure."},{title:"Pressure Plate Alarm",initiativeCount:"Round End",triggerEffect:"Stepping on an unmarked plate alerts nearby reinforcements or seals a nearby exit \u2014 the trap itself does no damage, but it changes what happens next."},{title:"Overloading Rune",initiativeCount:20,triggerEffect:"A magical rune nearby is building toward failure. Each time this triggers, the eventual burst grows larger \u2014 better to disable it early than let it cook."},{title:"Corrupted Ley Line",initiativeCount:"Round End",triggerEffect:"Spellcasting standing on the corrupted ground has a chance to misfire, dealing damage to the caster instead of or alongside its intended effect."},{title:"Restless Spirits",initiativeCount:"Round End",triggerEffect:"Whispers and cold spots unsettle the area. A creature that ends its turn there must succeed on a DC 12 Wisdom save or have disadvantage on its next attack roll."},{title:"Rockslide Warning",initiativeCount:20,triggerEffect:"Loose rock begins to slide. Anyone below the slope makes a DC 13 Dexterity save, taking 2d6 bludgeoning damage and being buried in debris (restrained) on a failure."},{title:"Burning Oil Slick",initiativeCount:"Round End",triggerEffect:"A spilled, ignitable liquid spreads to an adjacent square. Any creature that ends its turn in an ignited square takes 1d6 fire damage."},{title:"Live Wire Grate",initiativeCount:20,triggerEffect:"A metal grate or railing is charged. Any creature touching it takes 1d8 lightning damage and can be pushed back 5 ft."},{title:"Fouled Water Source",initiativeCount:"Round End",triggerEffect:"Anyone n a DC 12 Constitution save or have disadvantage on its next saving throw."},{title:"Loose Prisoner",initiativeCount:"Round End",triggerEffect:"Someone locked up nearby breaks free. Depending on who they are, they may join either side, flee, or start causing trouble of their own."},{title:"Overhead Hazard",initiativeCount:20,triggerEffect:"Something heavy and precarious above (a chandelier, a stalactite, a support beam) shifts further. It's one trigger away from coming down on whoever is below it."},{title:"Spore-Laced Fog",initiativeCount:"Round End",triggerEffect:"A low fog thick with something unnatural creeps across another 10-ft square, obscuring vision and carrying whatever effect the fog is tied to."},{title:"Broken Ward Line",initiativeCount:"Round End",triggerEffect:"A protective boundary that had been holding something back weakens further. Once it fully fails, whatever it was containing gets free."},{title:"Splitting Ice",initiativeCount:20,triggerEffect:"Cracks race further across a frozen surface. Anyone standing on the ice must succeed on a DC 13 Dexterity save or fall through into the freezing water below."},{title:"Backfiring Machine",initiativeCount:20,triggerEffect:"A piece of arcane or mechanical equipment nearby malfunctions, venting damage or a status effect in a burst around itself before someone shuts it down."}],CUSTOM_HAZARDS_KEY="tactics-table-custom-hazards-v1",COMBAT_OBJECTIVES=[{title:"Wipe Out the Enemy",description:"Defeat everyone hostile on the field \u2014 the straightforward option.",moraleThresholds:"Pair this with an actual morale/retreat threshold so it doesn't just become a slog to zero HP."},{title:"Take Down the Boss",description:"One specific enemy is the real target; everything else is just in the way.",moraleThresholds:"The fight ends the moment the boss falls \u2014 minions may scatter or fight on without them."},{title:"Escort the VIP",description:"An ally needs to survive and keep moving; the enemies want them dead, captured, or turned back.",moraleThresholds:"The win condition is the VIP reaching safety, not killing every attacker."},{title:"Rescue the Hostage",description:"A captive needs freeing before anything else matters \u2014 a classic for a reason.",moraleThresholds:"Once the hostage is secured, remaining enemies may just be trying to stop the escape."},{title:"Hold the Line",description:"Enemies are pouring in through multiple entrances; sealing them off ends the fight.",moraleThresholds:"The fight is won by closing/holding the entrances, not by killing every attacker that comes through."},{title:"Break Contact",description:"The goal is reaching an exit or triggering an escape \u2014 not clearing the room.",moraleThresholds:"The fight ends the instant the party crosses the threshold or trigger point, even mid-combat."},{title:"Stop the Ritual",description:"A countdown or puzzle is running alongside the fight; disrupting it is the actual win condition.",moraleThresholds:"Killing every enemy is optional \u2014 stopping the ritual in time is what matters."},{title:"Secure the Prize",description:"One specific object is what everyone is actually fighting over.",moraleThresholds:"Whoever holds the object when the dust settles effectively wins, regardless of body count."},{title:"Turn the Tide",description:"The party starts on the back foot \u2014 outnumbered or ambushed \u2014 and the win condition is stabilizing, not steamrolling.",moraleThresholds:"Track the moment the fight flips in the party's favor; enemy morale should break once it does."},{title:"Buy Time",description:"Nobody actually needs to win the fight itself \u2014 they need it to last (or end) by a certain point while something else finishes.",moraleThresholds:"Victory is measured in rounds survived or stalled, not in bodies on the floor."},{title:"Draw Them Out",description:"The real threat is hidden or hanging back; the fight is about forcing it into the open.",moraleThresholds:"Visible enemies may just be bait \u2014 the encounter isn't over until the real target shows itself."},{title:"Protect the Caster",description:"An ally is mid-ritual or mid-spell and needs cover while they finish; interrupting them is the failure state, not a party death.",moraleThresholds:"Enemies focus on reaching or disrupting the caster over trading blows with the party directly."},{title:"Clear the Path",description:"The fight exists to remove what's blocking a route forward \u2014 killing everyone is optional if the way opens some other way.",moraleThresholds:"The moment the path is clear, remaining enemies may no longer have a reason to keep fighting."},{title:"Take Them Alive",description:"At least one enemy needs to survive and be captured \u2014 lethal force works against the actual goal here.",moraleThresholds:"Killing the target is a failure state even if every other enemy is defeated."},{title:"Deny the Objective",description:"The enemy is trying to reach, activate, or destroy something \u2014 the party's job is only to stop that, not to wipe them out.",moraleThresholds:"The fight ends the instant the objective is safely denied, even with enemies still standing."},{title:"Champion's Duel",description:"The fight is framed as single combat or a formal challenge, with the rest of both sides expected to hold back and watch.",moraleThresholds:"Interference from either side may be seen as dishonorable \u2014 or it may be exactly what a treacherous enemy planned."}],COMBAT_OPTIMIZERS=[{title:"Free the Allies",description:"Captured or caged allies can be freed mid-fight, turning the numbers around.",mechanicalBenefit:"Freeing them adds combatants to the party's side or removes a hostage complication."},{title:"Take the High Ground",description:"Elevated terrain and vantage points are on the table.",mechanicalBenefit:"Ranged and melee attacks from height gain advantage; attacking uphill gives disadvantage."},{title:"Raid the Stash",description:"A cache of ammo, potions, or scrolls sits in reach for whoever claims it first.",mechanicalBenefit:"Reaching the stash grants a one-time resource \u2014 extra ammunition, a healing item, or a scroll."},{title:"Split the Battlefield",description:"Two zones are separated by a barrier with several small entrances either side can open or seal.",mechanicalBenefit:"Controlling the divider controls who can reinforce whom \u2014 a real chokepoint fight."},{title:"Fight from Below",description:"Enemies hold the floor above, with trapdoors or murder-holes into the party's space.",mechanicalBenefit:"Attacks from above get cover/elevation advantage; the party needs to find a way up or force enemies down."},{title:"Control the Levers",description:"A set of levers controls traps or barriers around the room.",mechanicalBenefit:"Whoever holds the levers can trigger or disable hazards for either side \u2014 a tug-of-war over control."},{title:"Grab the Big Gun",description:"One overpowered weapon or device sits on the field, up for grabs by either side.",mechanicalBenefit:"Wielding it grants a significantly stronger attack option than anything else on the field."},{title:"Claim the Boon",description:"A font, altar, or charge grants a one-time advantage to whoever reaches it first.",mechanicalBenefit:"Reaching it grants advantage on attacks (or a similar boost) for a limited time \u2014 pairs well with High Ground."},{title:"Sniper's Perch",description:"A ledge, tower, or window gives a clean, distant line on most of the battlefield.",mechanicalBenefit:"Attacks from the perch ignore half cover on the ground floor, but reaching or holding it under fire is its own challenge."},{title:"Healing Font",description:"A shrine, spring, or magical pool can mend wounds for whoever controls it.",mechanicalBenefit:"A creature that spends an action there regains hit points once per short rest's worth of uses \u2014 a real incentive to fight over it."},{title:"Bottleneck the Charge",description:"A narrow doorway, bridge, or hallway limits how many creatures can engage at once.",mechanicalBenefit:"Only one or two combatants can fight through the gap at a time \u2014 holding it turns numbers into a non-factor."},{title:"Mounts on the Field",description:"Beasts, vehicles, or other rideable options are available to either side.",mechanicalBenefit:"A mounted combatant gets extra speed and reach advantages, but becomes a bigger, easier target while riding."},{title:"Glare and Shadow",description:"A strong light source creates sharp contrast \u2014 blinding glare on one side, deep shadow on the other.",mechanicalBenefit:"Creatures fighting into the glare have disadvantage on attacks; creatures in the shadow gain an edge on Stealth."},{title:"Consecrated Ground",description:"The area is warded against a specific creature type \u2014 undead, fiends, aberrations.",mechanicalBenefit:"Affected creatures have disadvantage on attacks (or a similar penalty) while inside the warded area."},{title:"Volatile Cache",description:"Explosive or flammable barrels, kegs, or tanks are scattered around the field.",mechanicalBenefit:"Igniting one deals a burst of damage in an area \u2014 useful for either side willing to risk being caught in it too."},{title:"Panic the Crowd",description:"Bystanders, animals, or a startled crowd are present and can be spooked into causing chaos.",mechanicalBenefit:"Triggering a stampede or panic creates difficult terrain and forces saves to avoid being swept along with it."}];function loadCustomHazards(){try{const e=localStorage.getItem(CUSTOM_HAZARDS_KEY);return e?JSON.parse(e):[]}catch{return[]}}function saveCustomHazards(e){try{localStorage.setItem(CUSTOM_HAZARDS_KEY,JSON.stringify(e))}catch{}}let customMonsterCounter=0;const defaultAbilities={str:10,dex:10,con:10,int:10,wis:10,cha:10},TRAIT_TEXT={"Nimble Escape":"Can take the Disengage or Hide action as a bonus action on each of its turns.","Pack Tactics":"Has advantage on an attack roll against a creature if at least one of this creature's allie  against its Engulf.",Engulf:"Can move over a Medium or smaller creature's space as part of its movement; a creature it moves over must save or be engulfed, taking acid damage and being unable to breathe unless holding its breath.",Shapechanger:"Can use its action to polymorph into an object or back into its true form.","False Appearance":"While it remains motionless and disguised as an object, is indistinguishable from a normal object of that kind.",Grappler:"Has advantage on attack rolls against any creature it is grappling.","Two Heads":"Has advantage on Wisdom (Perception) checks and on saving throws against being blinded, charmed, deafened, frightened, stunned, and knocked unconscious.",Wakeful:"When one of its heads is asleep, the other head is awake.",Regeneration:"Regains hit points at the start of its turn unless it has taken acid or fire damage since its last turn; a creature can knock it out only by simultaneously dealing enough damage.",Stench:"Any creature that starts its turn within 5 feet of it must succeed on a Constitution save or be poisoned until the start of its next turn.","Turning Defiance":"Has advantage on saving throws against effects that turn undead."};function passivesToTraitDetails(e){return e.map(a=>{const t=a.replace(/\s*\([^)]*\)\s*$/,"").trim(),i=TRAIT_TEXT[t]||TRAIT_TEXT[a];return i?{name:a,description:i}:{name:a,description:""}}).filter(a=>a.description)}const REACTION_PASSIVE_PATTERN=/parry|deflect|shield|uncanny dodge|riposte|counter|redirect attack|interpose/i;function generateReactionCue(e){const a=e.passives||[],t=e.attacks||[],i=a.find(o=>REACTION_PASSIVE_PATTERN.test(o));if(i)return`Uses ${i.split("(")[0].trim()} in response to an incoming attack.`;const n=t.find(o=>o.type==="Melee");return n?`Makes an opportunity attack with ${n.name} against a foe that leaves its reach.`:t[0]?`No reach-based reaction \u2014 ${t[0].name} only works on its own turn.`:"No notable reaction available \u2014 acts only on its turn."}function buil ff","pass","summit"],desert:["desert","dune","sand","wasteland"],swamp:["swamp","marsh","bog","mire"],tundra:["tundra","snow","ice","glacier","frozen"],water:["water","river","lake","sea","ocean","flood","flooded","cellar","lagoon"],undead:["graveyard","cemetery","necropolis","haunted","undead","plague","barrow"],underdark:["underdark","deep cavern","subterranean","drow","duergar","abyssal depths"],coastal:["coast","beach","cliffside","harbor","pier","shipwreck","tide pool"],arctic:["arctic","glacial","frozen wastes","blizzard","permafrost","ice field"],planar:["planar","astral","ethereal","feywild","shadowfell","elemental plane","otherworldly"]},MAP_ELEMENTS={forest:["Broken canopy for partial cover/concealment","Root snarls or undergrowth as difficult terrain","A fallen tree or streambed as a natural chokepoint","Low-hanging branches that punish anyone who tries to fly through carelessly","A hollowed tree or den offering a hidden ambush spot","Patchy undergrowth that breaks line of sight between distant combatants"],cave:["Stalagmites/stalactites for cover and difficult terrain","Narrow tunnels as chokepoints","Uneven footing \u2014 consider a Dex save hazard for rushing in","An underground stream cutting across the floor","A ceiling low enough to matter for anything large or flying","Total darkness beyond torchlight for anyone without darkvision"],dungeon:["Doorways and corridors as chokepoints","Rubble or collapsed sections as difficult terrain","A trap or pressure plate tied to the hazard/clock","A portcullis or door that can be closed to split the fight","Alcoves and statuary for cover and ambush spots","A well or shaft connecting to a level below or above"],crypt:["Sarcophagi or alcoves for cover and ambush spots","Narrow burial corridors as chokepoints","A ritual circle or altar as a possible hazard focus","Loose grave dust or bone piles as difficult terrain","A sealed inner chamber that's clearly meant to stay sealed","Niches in the walls hiding more than just remains"],ruins:["Broken walls and rubble for cover","A partially collapsed floor as dangerous terrain","Elevation changes from crumbled stairs","Overgrown vines and roots reclaiming the structure as difficult terrain","A once-grand chamber with a dangerously unstable ceiling","Exposed foundations offering a way beneath the ruin"],urban:["Rooftops and alleys for verticality and flanking routes","Crowds or stalls the party may need to avoid harming","Windows and doorways as entry/escape routes","A narrow alley that turns into a hard chokepoint","A market stall or cart that can be overturned for cover","Balconies and awnings offering an unconventional route across"],sewer:["Narrow walkways over water as difficult terrain","Grates and tunnels as chokepoints","Poor visibility \u2014 consider dim light or darkness","A sluice gate that can be opened to flood a section","Slick, algae-covered stone underfoot as a slip hazard","Side tunnels offering a flanking route for whoever finds them first"],road:["Wagons, carts, or roadside rocks for cover","Open ground favoring ranged combatants","A ditch or treeline flanking the road for ambushers","A narrow bridge or ford as a natural chokepoint","Loose gravel or mud as minor difficult terrain","A milestone or marker offering just enough cover to matter"],hills:["Elevation for a high-ground advantage","Loose scree as difficult terrain","Long sightlines favoring ranged attackers","A dry streambed cutting a natural path through the terrain","Scattered boulders for cover on an otherwise open slope","A ridge line that blocks sight between the two sides of the fight"],mountain:["Narrow ledges and drop-offs \u2014 consider a fall hazard","Elevation and high-ground advantage","Wind or weather as an environmental factor","A rope bridge or narrow pass as a hard chokepoint","Loose rock that could be kicked or blasted loose deliberately","Thin air at altitude if that matters for this encounter"],desert:["Dunes for concealment and difficult terrain","Heat/exhaustion as a slow-building hazard","Long sightlines favoring ranged attackers","A sun-bleached ruin or wreck offering the only real cover","Shifting sand that swallows footprints and slows pursuit","A mirage or heat shimmer that could plausibly obscure something"],swamp:["Difficult terrain from mud and standing water","Poor visibility from fog or reeds","A submerged hazard (quicksand, leeches)","A rotten boardwalk that may not hold everyone's weight","Tangled mangrove roots breaking up sightlines","Stagnant pools that could hide something worse than mud"],tundra:["Difficult terrain from snow and ice","Cold as an environmental hazard","Poor visibility in whiteout conditions","Deep snowdrifts that swallow anyone without a way over them","An ice-crusted lake that may not hold everyone's weight","Sparse cover \u2014 a lone outcrop or wreck is worth fighting over"],water:["Difficult terrain / swimming rules in deep water","A current or rising tide as an escalating hazard","Limited footing for anyone who can't swim","A sandbar or rock offering the only dry footing nearby","Murky water limiting sightlines below the surface","Something with a swim speed having a serious home-field advantage"],undead:["A consecrated or desecrated area affecting undead specifically","Grave markers and disturbed earth as difficult terrain","An ossuary or bone pile that could animate on its own","A lingering unnatural chill marking where the dead are restless","Fresh graves suggesting more bodies could rise mid-fight","A shrine or ward that, if reached, could turn the tide against the undead"],underdark:["Absolute darkness beyond any light source the party carries","Fungal growths that could be hazardous to disturb","A chasm or bottomless drop somewhere nearby","Echoing acoustics that carry sound (and monsters) from far away","Mineral deposits or crystal growths as unusual terrain features","A route only creatures with tremorsense or blindsight can find in the dark"],coastal:["Slippery rocks and tide pools as difficult terrain","A rising or falling tide changing the battlefield mid-fight","Driftwood and wreckage for cover","Sea spray and wind affecting ranged attacks and footing","A cliffside drop into open water below","A beached or half-sunk vessel offering unusual verticality"],arctic:["Blinding snow limiting visibility and sightlines","Ice underfoot as a slip hazard in melee","Deep drifts as difficult terrain","A frozen-over hazard that could crack under enough weight or damage","Biting wind chill as a slow environmental threat","Scarce cover \u2014 an ice ridge or wreck is worth holding"],planar:["Reality behaving unreliably at the edges of the battlefield","A rift or portal that could pull combatants elsewhere mid-fight",`Gravity or orientation that isn't reliably "down"`,"An area where certain magic works differently than expected","Alien terrain offering no intuitive cover or footing","Something native to this plane that neither side fully understands"]},TIME_NOTES={dusk:"Dim light \u2014 consider granting darkvision creatures an edge over PCs without it.",night:"Darkness \u2014 torches become a tactical resource.",midnight:"Darkness \u2014 torches become a tactical resource.",dawn:"Low light and long shadows \u2014 a good excuse for an ambush.",morning:"Full visibility \u2014 no lighting penalty to plan around.",noon:"Full visibility, and bright light if that matters to any trait.",afternoon:"Full visibility \u2014 no lighting penalty to plan around.",storm:"Heavy rain and wind \u2014 ranged attacks and anything relying on fire face real penalties; thunder can mask sound.",rain:"Wet footing and reduced visibility \u2014 consider difficult terrain on unpaved ground and disadvantage on Perception (hearing).",fog:"Heavily obscured beyond a short range \u2014 most ranged attacks and long sightlines are off the table entirely.",snow:"Cold and slippery footing \u2014 consider a Dexterity save to avoid falling prone when moving at mor  skirmishers hit soft targets and retreat rather than committing to a stand-up fight.",morale:"Once half the group is down, survivors disengage.",optimizer:"Deny Them Cover",optDesc:"Their tactic depends on cover and mobility to hit-and-run.",benefit:"Open ground with sightlines forces a straight fight, which favors the party.",hazard:"They Call For Help",trigger:"If a skirmisher escapes early, treat that as a countdown to reinforcements."},{win:"Outlast the Hit-and-Run",winDesc:"No single exchange is dangerous \u2014 the danger is death by a hundred small cuts if the fight runs long.",morale:"They keep disengaging and re-engaging until a clear majority are down.",optimizer:"Cut Off the Escape Routes",optDesc:"Their whole plan depends on always having somewhere to retreat to.",benefit:"Blocking a chokepoint or exit turns their hit-and-run into a real fight.",hazard:"Reinforcements Were Already Coming",trigger:"This was never a fair fight to begin with \u2014 a second wave arrives on a fixed schedule regardless of how it's going."}],pack:[{win:"Break Up the Flank",winDesc:"This group wins through numbers advantage (Pack Tactics) \u2014 isolate one PC and gang up.",morale:"Once roughly half the pack is down, survivors fall back toward each other.",optimizer:"Don't Get Surrounded",optDesc:"Open ground lets the pack circle a target for advantage.",benefit:"Terrain that limits how many can reach one PC removes their main edge.",hazard:"The Pack Regroups",trigger:"If the party splits up, the pack redirects toward whoever is most isolated."},{win:"Thin the Herd Fast",winDesc:"The pack is dangerous in full numbers and much less so once it's been cut down \u2014 front-load the pressure.",morale:"Losing the first two members in quick succession breaks their nerve.",optimizer:"Hold a Defensible Position",optDesc:"A pack wants open ground and easy angles on an isolated target.",benefit:"High ground or a narrow approach denies most of the pack a clean shot at once.",hazard:"Some ion \u2014 they stay saved but sit out the fight.","2 \xB7 Add monsters: type a name to search the 2024 SRD (328 creatures) and your own saved monsters, or use Browse the compendium or Paste a stat block for anything else. Open a monster's arrow to read its stat block.","3 \xB7 Describe the scene (optional): Environment, Terrain, Situation and Time of day. They generate map ideas and can draft an Encounter plan: a win condition, a battlefield feature worth fighting over, and a ticking hazard. You can ignore all of it.","When you're ready, press Start combat."]},{title:"In Run Combat",body:["The list on the left is the initiative order. Whoever is acting is highlighted. Press Next turn to move on; the round counter goes up when the order wraps around.","Click anyone in the list to see their details on the right. Type an amount and press Enter (or Damage / Heal) to change hit points. Pick a damage type and the monster's resistances, immunities and vulnerabilities are applied for you. Temp HP absorb damage first, and a player at 0 HP gets a death-save tracker. Add conditions like Prone or Frightened under Conditions. You can change anyone's initiative number right in the list.","For monsters, the tabs show their Actions (attacks and multiattack), Stats (ability scores \u2014 click one to roll a check, or a save to roll it) and Tactics (how the creature fights right now). A player's ability scores and saves appear on their panel once you import their sheet.","Defeated monsters drop out of the order and wait at the bottom of the list in case you need to bring them back. For a big group, add them as a mob in Prep to track them with one shared headcount."]},{title:"Share with players",body:[`Sign in with Sync, then use Share to get a link for your players. They see the turn order, their own characters' hit points, and each monster's name and conditions \u2014 nothing else. Players can also type their own notes on each card, and you can choose to show how hurt each monster
