<title>Tactics Table</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>

<style>
  :root{
    --ink:#100e0a;
    --panel:#17130d;
    --panel-raised:#1e1810;
    --line:#342b1c;
    --line-soft:#241e14;
    --parchment:#ded1b3;
    --parchment-dim:#93876c;
    --parchment-faint:#5f5744;
    --blood:#ff4d4a;
    --blood-soft:rgba(255,77,74,.18);
    --blood-text:#ff8f8c;
    --amber:#ffb627;
    --amber-soft:rgba(255,182,39,.18);
    --amber-text:#ffd166;
    --arcane:#2ee6c9;
    --arcane-soft:rgba(46,230,201,.16);
    --arcane-text:#7ff5e3;
    --moss:#8fe85a;
    --moss-soft:rgba(143,232,90,.2);
    --grain: rgba(255,255,255,.012);
    --veil: rgba(6,5,3,.78);
    --glow-blood: 0 0 16px rgba(255,77,74,.35);
    --glow-arcane: 0 0 16px rgba(46,230,201,.3);
  }
  :root[data-theme="light"]{
    --ink:#f1ead9;
    --panel:#fdfaf3;
    --panel-raised:#f4ecd9;
    --line:#d9cba3;
    --line-soft:#e7dcbe;
    --parchment:#2c2415;
    --parchment-dim:#5c5236;
    --parchment-faint:#8a7d5c;
    --blood:#d81e1e;
    --blood-soft:rgba(216,30,30,.14);
    --blood-text:#a11616;
    --amber:#c47f00;
    --amber-soft:rgba(196,127,0,.14);
    --amber-text:#8f5c00;
    --arcane:#0d9488;
    --arcane-soft:rgba(13,148,136,.14);
    --arcane-text:#0a6b62;
    --moss:#4d8a1f;
    --moss-soft:rgba(77,138,31,.16);
    --grain: rgba(0,0,0,.02);
    --veil: rgba(30,24,10,.5);
    --glow-blood: 0 0 14px rgba(216,30,30,.22);
    --glow-arcane: 0 0 14px rgba(13,148,136,.2);
  }

  *{box-sizing:border-box;}
  body{
    background:
      repeating-linear-gradient(135deg, var(--grain) 0px, var(--grain) 1px, transparent 1px, transparent 3px),
      var(--ink);
    color:var(--parchment);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
  }
  h1,h2,h3,.display{ font-family:'Cinzel', Georgia, serif; text-wrap:balance; }
  .mono{font-family:'IBM Plex Mono', ui-monospace, monospace;}
  .eyebrow{ font-size:12.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase; }
  ::selection{ background:var(--blood-soft); color:var(--parchment); }
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-track{background:var(--panel);}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}
  button{font-family:inherit;cursor:pointer;}
  button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--arcane); outline-offset:1px;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }

  .shell{max-width:1360px; margin:0 auto; padding:1px 20px 40px;}
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(var(--ink), var(--ink) 80%, transparent);
    border-bottom:1px solid var(--line-soft);
    padding:16px 20px 14px;
  }
  .topbar-inner{max-width:1360px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px;}
  .brand{display:flex; align-items:center; gap:12px;}
  .brand h1{font-size:21px; font-weight:600; letter-spacing:.02em; margin:0; color:var(--parchment);}
  .brand p{margin:2px 0 0; font-size:14px; color:var(--parchment-dim);}
  .topbar-actions{display:flex; align-items:center; gap:8px;}

  .btn{
    display:inline-flex; align-items:center; gap:6px;
    border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-dim);
    padding:7px 12px; font-size:13.5px; font-weight:500; letter-spacing:.02em;
    border-radius:2px; transition:border-color .15s, color .15s, background .15s;
  }
  .btn:hover{color:var(--parchment); border-color:var(--parchment-faint);}
  .btn-arcane{border-color:rgba(79,168,154,.4); color:var(--arcane); background:var(--arcane-soft);}
  .btn-arcane:hover{border-color:var(--arcane); background:rgba(79,168,154,.24);}
  .btn-blood{border-color:rgba(178,60,55,.45); color:var(--blood-text); background:var(--blood-soft);}
  .btn-blood:hover{border-color:var(--blood); background:rgba(178,60,55,.24);}
  .btn[disabled]{opacity:.35; cursor:not-allowed;}
  .icon-toggle{
    display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px;
    border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-dim); border-radius:2px;
  }
  .icon-toggle:hover{ color:var(--parchment); border-color:var(--parchment-faint); }

  /* axes strip — top of page */
  .axes-strip{ margin:18px 0; }
  .axes-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;}
  .axes-head h2{font-size:14.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; margin:0; color:var(--parchment); display:flex; align-items:center; gap:7px;}
  .axes-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px;}
  @media (max-width:900px){ .axes-grid{grid-template-columns:1fr;} }
  .axis-card{position:relative; background:var(--panel); border:1px solid var(--line); padding:12px 14px;}
  .axis-card.axis-locked{border-style:dashed;}
  .icon-btn.lock-active{color:var(--amber);}
  .icon-btn[disabled]{opacity:.35; cursor:not-allowed;}
  .axis-eyebrow{display:flex; align-items:center; gap:5px; margin-bottom:4px;}
  .axis-title{font-size:15px; font-weight:600; color:var(--parchment); margin:0;}
  .axis-desc{font-size:13.5px; color:var(--parchment-dim); margin-top:4px; line-height:1.5;}
  .axis-note{font-size:13px; margin-top:6px; line-height:1.5; font-style:italic; padding-left:8px; border-left:2px solid var(--c, var(--line));}
  .axis-badge{font-size:12px; padding:2px 8px; border:1px solid var(--c, var(--line)); color:var(--c, var(--parchment-dim)); flex-shrink:0;}

  /* round tracker */
  .roundbar{
    background:var(--panel); border:1px solid var(--line); padding:12px 16px; margin:0 0 18px;
  }
  .roundbar-top{ display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .roundbar-stats{display:flex; align-items:center; gap:22px;}
  .stat-label{font-size:12px; color:var(--parchment-faint); letter-spacing:.1em; text-transform:uppercase; margin:0 0 2px;}
  .stat-value{font-size:26px; font-weight:600; line-height:1; margin:0; font-variant-numeric:tabular-nums;}
  .stat-divider{width:1px; height:28px; background:var(--line);}
  .active-name{font-size:17px; font-weight:600; color:var(--blood); margin:0; font-family:'Cinzel',serif;}
  .roundbar-actions{display:flex; gap:8px; flex-wrap:wrap;}

  .init-track{ display:flex; gap:6px; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px solid var(--line-soft); }
  .init-chip{
    display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; padding:5px 10px 5px 6px;
    border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-dim); border-radius:20px;
  }
  .init-chip.pc{ border-color:rgba(46,230,201,.3); }
  .init-chip.monster{ border-color:rgba(255,77,74,.3); }
  .init-chip.active{ background:var(--blood-soft); border-color:var(--blood); color:var(--parchment); box-shadow:var(--glow-blood); }
  .init-num{ display:inline-flex; align-items:center; justify-content:center; min-width:20px; height:20px; padding:0 4px; border-radius:50%; background:var(--line); color:var(--parchment); font-size:11px; font-weight:700; }
  .init-chip.active .init-num{ background:var(--blood); color:var(--ink); }
  .init-input{ width:36px; background:var(--ink); border:1px solid var(--line); color:inherit; font-family:inherit; font-size:12.5px; text-align:center; padding:2px; border-radius:3px; }

  /* generic plate / card */
  .plate{ position:relative; background:var(--panel); border:1px solid var(--line); }
  .plate-head{ display:flex; align-items:center; gap:8px; padding:11px 14px; border-bottom:1px solid var(--line-soft); }
  .plate-head h2{font-size:14.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; margin:0; color:var(--parchment);}
  .corner{position:absolute; width:9px; height:9px; pointer-events:none;}
  .corner-tl{top:-1px; left:-1px; border-top:1.5px solid var(--c, var(--line)); border-left:1.5px solid var(--c, var(--line));}
  .corner-tr{top:-1px; right:-1px; border-top:1.5px solid var(--c, var(--line)); border-right:1.5px solid var(--c, var(--line));}
  .corner-bl{bottom:-1px; left:-1px; border-bottom:1.5px solid var(--c, var(--line)); border-left:1.5px solid var(--c, var(--line));}
  .corner-br{bottom:-1px; right:-1px; border-bottom:1.5px solid var(--c, var(--line)); border-right:1.5px solid var(--c, var(--line));}

  .stack > * + *{margin-top:16px;}

  /* party */
  .party-row{padding:10px 14px; border-bottom:1px solid var(--line-soft);}
  .party-row:last-child{border-bottom:none;}
  .party-top{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .party-name{font-weight:600; color:var(--parchment); font-size:15px;}
  .party-role{font-size:12.5px; color:var(--parchment-faint); margin-left:6px;}
  .party-ac{display:flex; align-items:center; gap:4px; font-size:13px; color:var(--parchment-dim); flex-shrink:0;}
  .party-priority{font-size:13px; color:var(--amber-text); font-style:italic; margin-top:5px; line-height:1.4;}
  .link-icon{color:var(--parchment-faint); flex-shrink:0; display:inline-flex;}
  .link-icon:hover{color:var(--arcane);}
  .icon-btn{color:var(--parchment-faint); background:none; border:none; padding:2px; display:inline-flex;}
  .icon-btn:hover{color:var(--blood);}

  .disclosure{ border-top:1px solid var(--line-soft); }
  .disclosure-toggle{
    width:100%; display:flex; align-items:center; justify-content:center; gap:6px;
    padding:9px; font-size:13px; color:var(--parchment-dim); background:none; border:none;
  }
  .disclosure-toggle:hover{ color:var(--parchment); }
  .disclosure-body{ padding:0 14px 12px; display:flex; flex-direction:column; gap:6px; }

  .field{padding:9px 14px;}
  .field label{display:block; font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--parchment-faint); margin-bottom:4px;}
  .text-input{
    width:100%; background:var(--ink); border:1px solid var(--line); color:var(--parchment);
    font-size:13.5px; padding:6px 8px; font-family:inherit;
  }
  .text-input::placeholder{color:var(--parchment-faint);}
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }
  .add-btn{
    display:flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--arcane); background:var(--arcane-soft);
    color:var(--arcane); font-size:13px; font-weight:600; padding:7px; transition:background .15s;
  }
  .add-btn:hover{background:rgba(79,168,154,.24);}
  .add-btn[disabled]{opacity:.35; cursor:not-allowed;}

  /* hp bar */
  .hp-row{display:flex; flex-direction:column; gap:6px; margin-top:7px;}
  .hp-row-sub{display:flex; align-items:center; gap:8px;}
  .hp-track{width:100%; flex-shrink:0; height:6px; background:var(--line-soft); position:relative; overflow:hidden;}
  .hp-fill{height:100%; transition:width .25s ease;}
  .hp-track::after{
    content:''; position:absolute; inset:0;
    background:repeating-linear-gradient(90deg, rgba(0,0,0,.3) 0 1px, transparent 1px 8%);
    pointer-events:none;
  }
  .hp-text{font-size:12.5px; color:var(--parchment-dim); width:52px; text-align:right; flex-shrink:0;}
  .stepper{
    display:flex; align-items:center; justify-content:center; width:20px; height:20px;
    border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-dim); flex-shrink:0;
    transition:border-color .15s, color .15s;
  }
  .stepper:hover.dmg{border-color:var(--blood); color:var(--blood-text);}
  .stepper:hover.heal{border-color:var(--moss); color:#a9c684;}

  .ac-input{ width:34px; background:transparent; border:none; color:inherit; font-family:inherit; font-size:inherit; padding:0; text-align:left; }
  .ac-input:focus{ outline:1px solid var(--arcane); }
  .hp-num{ width:46px; text-align:center; padding:3px 2px; }

  .action-btn{
    display:flex; align-items:center; justify-content:center; width:32px; height:32px; flex-shrink:0;
    border:1.5px solid var(--line); background:var(--panel-raised); color:var(--parchment-dim);
    border-radius:3px; transition:border-color .15s, color .15s, background .15s;
  }
  .action-btn.defeat{ border-color:rgba(255,182,39,.35); }
  .action-btn.defeat:hover{ color:var(--amber-text); border-color:var(--amber); background:var(--amber-soft); }
  .action-btn.defeat.active{ background:var(--line-soft); border-color:var(--parchment-faint); color:var(--parchment); }
  .action-btn.remove{ border-color:rgba(255,77,74,.35); color:var(--blood-text); }
  .action-btn.remove:hover{ border-color:var(--blood); background:var(--blood-soft); color:var(--blood-text); box-shadow:var(--glow-blood); }
  .action-btn.apply{ width:30px; height:30px; border-color:rgba(46,230,201,.4); color:var(--arcane); }
  .action-btn.apply:hover{ border-color:var(--arcane); background:var(--arcane-soft); }
  .hp-delta{ width:64px; text-align:center; }

  /* scene */
  .monster-add{ display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; border:1px dashed var(--line); background:var(--panel); padding:12px 14px; }
  .monster-add .grow{flex:1; min-width:220px;}
  .monster-add .hint{font-size:12px; color:var(--parchment-faint); margin-top:4px;}
  .monster-add .qty{width:52px; text-align:center;}
  .monster-add .add-btn{border-color:var(--blood); background:var(--blood-soft); color:var(--blood-text); padding:7px 14px;}
  .monster-add .add-btn:hover{background:rgba(178,60,55,.24);}
  .monster-add-row{display:flex; flex-wrap:wrap; gap:8px; align-items:flex-end; width:100%;}

  .monster-grid{column-width:300px; column-gap:16px; margin-top:16px;}
  @media (max-width:620px){ .monster-grid{column-width:100%;} }
  .mcard{padding:0; transition:opacity .2s; display:inline-block; width:100%; margin-bottom:16px; break-inside:avoid; vertical-align:top;}
  .mcard.defeated{opacity:.4;}
  .mcard-head{display:flex; flex-direction:column; gap:6px; padding:11px 14px; cursor:pointer;}
  .mcard-head:hover{ background:var(--panel-raised); }
  .mcard-head-top{display:flex; align-items:center; gap:8px;}
  .mcard-head-bottom{display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; padding-left:24px;}
  .mcard-senses{font-size:11.5px; color:var(--parchment-faint); margin:2px 0 0 24px;}
  .mcard-head-actions{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .mcard-name{font-size:17px; font-weight:600; color:var(--parchment); margin:0; flex:1; min-width:0;}
  .mcard-type{font-size:12.5px; color:var(--parchment-faint); margin:0;}
  .mcard-body{padding:0 14px 13px;}
  .ac-badge{display:flex; align-items:center; gap:4px; font-size:13px; color:var(--parchment-dim); flex-shrink:0;}
  .mcard-collapsed-meta{ display:flex; flex-direction:column; gap:7px; padding:0 14px 12px; }
  .mcard-meta-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .posture-chip{ font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:20px; border:1px solid var(--c); color:var(--c); background:var(--c-soft); flex-shrink:0; white-space:nowrap; }
  .init-label{display:flex; align-items:center; gap:5px; flex-shrink:0;}
  .init-label span{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--parchment-faint);}
  .hp-exact-row{display:flex; align-items:center; gap:7px; margin:10px 0; flex-wrap:wrap;}
  .hp-exact-label{font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--parchment-faint);}
  .hp-exact-sep{color:var(--parchment-faint);}
  .hp-exact-hint{font-size:11px; color:var(--parchment-faint);}
  .chevron{ color:var(--parchment-faint); transition:transform .15s; flex-shrink:0; }
  .chevron.open{ transform:rotate(90deg); }

  .abl-grid{display:grid; grid-template-columns:repeat(6,1fr); gap:1px; margin:10px 0; background:var(--line-soft);}
  .abl-cell{ background:var(--panel); text-align:center; padding:5px 2px; }
  .abl-cell .k{font-size:10.5px; font-weight:700; color:var(--parchment-faint);}
  .abl-cell .v{font-size:12.5px; color:var(--parchment); }
  .abl-cell .v span{color:var(--parchment-faint);}

  .posture-row{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin-top:4px;}
  .posture-btn{ border:1px solid var(--line); background:var(--panel-raised); color:var(--parchment-faint); font-size:12px; font-weight:600; letter-spacing:.03em; padding:6px 4px; text-align:center; }
  .posture-btn.active{border-color:var(--c); background:var(--c-soft); color:var(--c);}
  .posture-detail{border:1px solid var(--c); background:var(--c-soft); padding:10px 12px; margin-top:5px;}
  .axis-live-context{border:1px dashed var(--amber); background:var(--amber-soft); padding:8px 12px; margin-top:6px;}
  .axis-live-context p{font-size:12.5px; color:var(--amber-text); margin:2px 0;}
  .axis-live-context b{color:var(--amber-text);}
  .posture-detail p{font-size:13px; line-height:1.55; color:var(--parchment); margin:5px 0 0;}
  .posture-detail p:first-child{margin-top:0;}
  .posture-detail b{color:var(--parchment-dim); font-weight:600;}
  .tag-row{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px;}
  .tag{font-size:11px; border:1px solid var(--line); color:var(--parchment-dim); padding:1.5px 7px; border-radius:20px;}

  .section-label{display:flex; align-items:center; gap:5px; margin:13px 0 6px;}
  .section-label span{font-size:11.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--parchment-faint);}
  .attack-row{display:flex; align-items:baseline; justify-content:space-between; gap:8px; font-size:13.5px; padding:2px 0;}
  .attack-name{color:var(--parchment); font-weight:500; flex-shrink:0;}
  .attack-stats{color:var(--parchment-dim); font-size:12.5px; text-align:right;}
  .spell-meta{font-size:11px; color:var(--parchment-faint); margin-left:auto; text-transform:none; letter-spacing:normal;}
  .spell-row{display:flex; align-items:baseline; gap:8px; font-size:13px; padding:2px 0;}
  .spell-freq{color:var(--parchment-dim); font-weight:600; flex-shrink:0; font-size:11.5px; white-space:nowrap;}
  .spell-names{color:var(--parchment);}
  .multiattack-badge{font-size:10px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--blood-text); background:var(--blood-soft); border:1px solid rgba(178,60,55,.4); border-radius:20px; padding:2px 7px; margin-left:2px;}

  .callout{display:flex; align-items:flex-start; gap:6px; margin-top:11px;}
  .callout p{font-size:12.5px; line-height:1.5; color:var(--parchment-dim); margin:0;}
  .callout.reaction svg{color:var(--amber); margin-top:1px; flex-shrink:0;}
  .callout.passive svg{color:var(--parchment-faint); margin-top:1px; flex-shrink:0;}

  .trait-block{ border:1px solid var(--line); background:var(--ink); padding:10px 12px; margin-top:11px; }
  .trait-block .lbl{font-size:11.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; color:var(--parchment-faint); display:block; margin-bottom:6px;}
  .trait-block p{font-size:13px; line-height:1.5; color:var(--parchment-dim); margin:6px 0 0;}
  .trait-block p:first-of-type{margin-top:0;}
  .trait-block b{color:var(--parchment); font-weight:600;}
  .trigger-dc{font-size:12px; color:var(--amber-text); margin-top:3px; display:block;}

  /* modal */
  .modal-veil{position:fixed; inset:0; background:var(--veil); display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;}

/* ---------- markdown parser ---------- */
class MarkdownParseError extends Error {}
// Some artifact-viewer runtimes expose the `sample` capability's base function
// (and `.limits()`) but not the `.json()` helper — call the base function and
// parse JSON out of its text ourselves so both cases work, mirroring the
// tolerant parsing `.json()` itself would have done.
function extractJsonFromText(text){
  try{ return JSON.parse(text); }catch{}
  const fence = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  if(fence){ try{ return JSON.parse(fence[1]); }catch{} }
  const start = text.search(/[[{]/);
  const end = Math.max(text.lastIndexOf('}'), text.lastIndexOf(']'));
  if(start !== -1 && end > start){ try{ return JSON.parse(text.slice(start, end+1)); }catch{} }
  const err = new Error("Claude's reply couldn't be read as JSON.");
  err.code = 'invalid_json'; err.text = text;
  throw err;
}
async function sampleJson(sampleFn, input, options){
  const result = await sampleFn(input, options);
  return extractJsonFromText(result.text);
}
function slugify(name){ return (name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'')) || 'item'; }
function toLines(md){ return md.replace(/\r\n/g,'\n').split('\n'); }
function splitByHeading(lines, level){
  const marker = '#'.repeat(level) + ' ';
  const blocks = []; let current = null;
  for(const line of lines){
    const isThisLevel = line.startsWith(marker);
    const hMatch = line.match(/^#+/);
    const isShallower = /^#{1,6} /.test(line) && hMatch[0].length < level;
    if(isThisLevel){ if(current) blocks.push(current); current = {heading:line.slice(marker.length).trim(), lines:[]}; }
    else if(isShallower){ if(current) blocks.push(current); current = null; }
    else if(current){ current.lines.push(line); }
  }
  if(current) blocks.push(current);
  return blocks;
}
function parseBullets(lines){
  const map = new Map();
  for(const line of lines){
    const m = line.match(/^-\s*([A-Za-z][A-Za-z0-9 /_-]*)\s*:\s*(.*)$/);
    if(!m) continue;
    map.set(m[1].trim().toLowerCase().replace(/[\s_-]+/g,''), m[2].trim());
  }
  return map;
}
function requireField(map, key, context){
  const v = map.get(key);
  if(v === undefined) throw new MarkdownParseError(`Missing required field "${key}" in ${context}.`);
  return v;
}
function splitTrailingParen(heading){
  const t = heading.trim();
  if(!t.endsWith(')')) return null;
  let depth = 0;
  for(let i=t.length-1; i>=0; i--){
    const ch = t[i];
    if(ch === ')') depth++;
    else if(ch === '('){ depth--; if(depth === 0) return {name:t.slice(0,i).trim(), inner:t.slice(i+1,-1).trim()}; }
  }
  return null;
}
function parseHp(raw, context){
  const m = raw.match(/^\s*(\d+)\s*\/\s*(\d+)\s*$/);
  if(!m) throw new MarkdownParseError(`Invalid HP format "${raw}" in ${context}. Expected "current/max".`);
  return {current:Number(m[1]), max:Number(m[2])};
}
function parseInt10(raw, field, context){
  const n = Number(raw);
  if(Number.isFinite(n)) return n;
  // Tolerate a leading number followed by units/notes, e.g. "18 (half plate)" or "40 ft." —
  // pull out the first integer rather than requiring the whole field to be numeric.
  const m = String(raw).match(/-?\d+/);
  if(!m) throw new MarkdownParseError(`Invalid number "${raw}" for "${field}" in ${context}.`);
  return Number(m[0]);
}
function parseList(raw){ return raw ? raw.split(',').map(s=>s.trim()).filter(Boolean) : []; }
const defaultAbilityScores = {str:10,dex:10,con:10,int:10,wis:10,cha:10};
const validStyles = ['brute','skirmisher','pack','mindless','ambusher','leader'];
function parseAbilityScores(raw, context){
  if(!raw) return {...defaultAbilityScores};
  const scores = {...defaultAbilityScores};
  for(const part of raw.split(',')){
    const m = part.trim().match(/^(STR|DEX|CON|INT|WIS|CHA)\s+(\d+)/i);
    if(!m) throw new MarkdownParseError(`Invalid ability score entry "${part.trim()}" in ${context}. Expected "STR 16, DEX 10, ...".`);
    scores[m[1].toLowerCase()] = Number(m[2]);
  }
  return scores;
}
function parseTraitDetails(lines){
  return lines.map(l=>l.trim()).filter(l=>l.startsWith('-')).map(line=>{
    const m = line.slice(1).trim().match(/^([^:]+):\s*(.*)$/);
    if(!m) throw new MarkdownParseError(`Trait line "${line}" must have format: Name: full description text`);
    return {name:m[1].trim(), description:m[2].trim()};
  });
}

function parsePartyMember(block){
  const context = `party member "${block.heading}"`;
  const f = parseBullets(block.lines);
  const role = requireField(f,'role',context);
  const roles = ['Druid','Rogue','Paladin','Cleric','Warlock','Custom'];
  const hp = parseHp(requireField(f,'hp',context), context);
  return {id:slugify(block.heading), name:block.heading, role:roles.includes(role)?role:'Custom',
    species: f.get('species') || undefined,
    ac:parseInt10(requireField(f,'ac',context),'AC',context), hpCurrent:hp.current, hpMax:hp.max,
    tacticalPriority:requireField(f,'tacticalpriority',context), conditions:parseList(f.get('conditions')),
    referenceLink: f.get('referencelink') || f.get('dndbeyond') || undefined};
}
function parseScene(block){
  if(!block) return {environment:'', terrain:'', combatSituation:'', timeOfDay:''};
  const f = parseBullets(block.lines);
  return {environment:f.get('environment') ?? '', terrain:f.get('terrain') ?? '', combatSituation:f.get('combatsituation') ?? '', timeOfDay:f.get('timeofday') ?? ''};
}
function parseAxes(sections){
  const winB = sections.find(b=>/^win condition:/i.test(b.heading));
  const optB = sections.find(b=>/^battlefield optimizer:/i.test(b.heading));
  const hazB = sections.find(b=>/^hazard\s*\/?\s*clock:/i.test(b.heading));
  if(!winB) throw new MarkdownParseError('Missing "Win Condition:" section under Encounter Axes.');

    winCondition:{ title:winB.heading.replace(/^win condition:\s*/i,'').trim(), description:requireField(wf,'description','Win Condition section'), moraleThresholds:requireField(wf,'moralethresholds','Win Condition section')},
    battlefieldOptimizer:{ title:optB.heading.replace(/^battlefield optimizer:\s*/i,'').trim(), description:requireField(of,'description','Battlefield Optimizer section'), mechanicalBenefit:requireField(of,'mechanicalbenefit','Battlefield Optimizer section')},
    hazardOrClock:{ title:hazB.heading.replace(/^hazard\s*\/?\s*clock:\s*/i,'').trim(), initiativeCount, triggerEffect:requireField(hf,'triggereffect','Hazard/Clock section')},

function parseTraitTrigger(block){
  const context = `trait trigger "${block.heading}"`;
  const split = splitTrailingParen(block.heading);
  if(!split) throw new MarkdownParseError(`Trait trigger heading "${block.heading}" must be in the form "Name (Creature)".`);
  const f = parseBullets(block.lines);
  return {id:slugify(block.heading), name:split.name, creatureName:split.inner,
    triggerCondition:requireField(f,'triggercondition',context), mechanicalEffect:requireField(f,'mechanicaleffect',context), formulaOrDC:requireField(f,'formula/dc',context)};
}
function parseAttacks(lines, context){
  const validTypes = ['Melee','Ranged','Save'];
  return lines.map(l=>l.trim()).filter(l=>l.startsWith('-')).map(line=>{
    const parts = line.slice(1).split('|').map(p=>p.trim());
    if(parts.length < 5) throw new MarkdownParseError(`Attack line "${line}" in ${context} must have format: Name | Type | Formula | Range | Damage [| Notes]`);
    const [name, type, formula, reachOrRange, damage, notes] = parts;
    if(!validTypes.includes(type)) throw new MarkdownParseError(`Attack "${name}" in ${context} has invalid type "${type}". Expected Melee, Ranged, or Save.`);
    return {name, type, formula, reachOrRange, damage, notes: notes || undefined};
  });
}
function parsePosture(block, context){
  const f = parseBullets(block.lines);
  return {trigger:requireField(f,'trigger',context), movement:requireField(f,'movement',context), action:requireField(f,'action',context), bonusAction:f.get('bonusaction'), tags:parseList(f.get('tags'))};
}
function parseSpellcasting(block){
  const f = parseBullets(block.lines);
  const ability = f.get('ability');
  const dc = f.get('dc');
  const lists = [];
  for(const line of block.lines){
    const m = line.trim().match(/^-\s*([A-Za-z][A-Za-z0-9 /_()-]*)\s*:\s*(.*)$/);
    if(!m) continue;
    const key = m[1].trim();
    if(/^ability$/i.test(key) || /^dc$/i.test(key)) continue;
    const spells = parseList(m[2]);
    if(spells.length) lists.push({freq:key, spells});
  }
  if(!ability && !dc && lists.length===0) return undefined;
  return {ability, dc, lists};
}
function parseMonster(block){
  const context = `monster "${block.heading}"`;
  const split = splitTrailingParen(block.heading);
  if(!split) throw new MarkdownParseError(`Monster heading "${block.heading}" must be in the form "Name (Base Type)".`);
  const f = parseBullets(block.lines);
  const hp = parseHp(requireField(f,'hp',context), context);
  const sub = splitByHeading(block.lines, 4);
  const traitsB = sub.find(b=>/^traits$/i.test(b.heading));
  const attacksB = sub.find(b=>/^attacks$/i.test(b.heading));
  const spellsB = sub.find(b=>/^spells$/i.test(b.heading));
  const pA = sub.find(b=>/^posture a:/i.test(b.heading));
  const pB = sub.find(b=>/^posture b:/i.test(b.heading));
  const pC = sub.find(b=>/^posture c:/i.test(b.heading));
  if(!attacksB) throw new MarkdownParseError(`Missing "#### Attacks" section in ${context}.`);
  const styleRaw = f.get('style')?.toLowerCase();
  const style = validStyles.includes(styleRaw) ? styleRaw : 'skirmisher';
  const generated = generatePostures(style);
  return {id:slugify(split.name), name:split.name, baseType:split.inner,
    ac:parseInt10(requireField(f,'ac',context),'AC',context), hpCurrent:hp.current, hpMax:hp.max,
    speed:parseInt10(requireField(f,'speed',context),'Speed',context),
    abilityScores: parseAbilityScores(f.get('abilityscores'), context),
    savingThrows: f.get('savingthrows') || undefined,
    resistances: f.get('resistances') ? parseList(f.get('resistances')) : undefined,
    vulnerabilities: f.get('vulnerabilities') ? parseList(f.get('vulnerabilities')) : undefined,
    style: validStyles.includes(styleRaw) ? styleRaw : undefined,
    passives:parseList(f.get('passives')),
    traitDetails: traitsB ? parseTraitDetails(traitsB.lines) : undefined,
    attacks:parseAttacks(attacksB.lines, context),

    reactionCue: f.get('reactioncue') || 'Autofilled — review and adjust before running.',
    postureA: pA ? parsePosture(pA, `${context} Posture A`) : generated.postureA,
    postureB: pB ? parsePosture(pB, `${context} Posture B`) : generated.postureB,
    postureC: pC ? parsePosture(pC, `${context} Posture C`) : generated.postureC,
    activePosture:'A', isDefeated:false};
}
function parseEncounterMarkdown(markdown){
  const lines = toLines(markdown);
  const titleLine = lines.find(l=>l.startsWith('# '));
  if(!titleLine) throw new MarkdownParseError('Missing top-level heading, e.g. "# Encounter: <name>".');
  const name = titleLine.replace(/^#\s*(Encounter:)?\s*/i,'').trim();
  if(!name) throw new MarkdownParseError('Encounter name is empty. Use "# Encounter: <name>".');
  const top = splitByHeading(lines, 2);
  const sceneS = top.find(b=>/^scene$/i.test(b.heading));
  const partyS = top.find(b=>/^party$/i.test(b.heading));
  const axesS = top.find(b=>/^encounter axes$/i.test(b.heading));
  const traitsS = top.find(b=>/^trait triggers$/i.test(b.heading));
  const monstersS = top.find(b=>/^monsters$/i.test(b.heading));
  if(!partyS) throw new MarkdownParseError('Missing "## Party" section.');
  if(!axesS) throw new MarkdownParseError('Missing "## Encounter Axes" section.');
  if(!monstersS) throw new MarkdownParseError('Missing "## Monsters" section.');
  const party = splitByHeading(partyS.lines, 3).map(parsePartyMember);
  if(party.length === 0) throw new MarkdownParseError('Party section has no members.');
  const axes = parseAxes(splitByHeading(axesS.lines, 3));
  const traitTriggers = traitsS ? splitByHeading(traitsS.lines, 3).map(parseTraitTrigger) : [];
  const monsterBlocks = splitByHeading(monstersS.lines, 3);
  if(monsterBlocks.length === 0) throw new MarkdownParseError('Monsters section has no entries.');
  const monsters = monsterBlocks.map(parseMonster);
  const round = {roundNumber:1, initiativeCount: typeof axes.hazardOrClock.initiativeCount === 'number' ? axes.hazardOrClock.initiativeCount : 20, activeCombatantId:null, monsters};
  return {id:slugify(name), name, scene:parseScene(sceneS), party, axes, traitTriggers, round};
}
function parseSingleMonsterMarkdown(monsterMarkdown){
  const blocks = splitByHeading(toLines(monsterMarkdown), 3);
  if(blocks.length === 0) throw new MarkdownParseError('No "### Name (Base Type)" heading found. Start the block with e.g. "### Zombie Plague Spreader (Medium Undead)".');
  return parseMonster(blocks[0]);
}

function generatePostures(style){
  switch(style){
    case 'brute': return {
      postureA:{trigger:'Combat starts or a target is within reach', movement:'Closes distance directly to the nearest or most threatening target.', action:'Attacks with its heaviest weapon.', bonusAction:'None.', tags:['Focus: Nearest threat']},
      postureB:{trigger:'Below 25% HP', movement:'Holds ground — brutes rarely retreat.', action:'Keeps attacking the target that hurt it most, even at disadvantage.', bonusAction:'None.', tags:['No morale','Fights to the end']},
      postureC:{trigger:'A choke point or doorway is available', movement:'Plants itself in the choke point to block the party.', action:'Attacks whoever tries to push past.', bonusAction:'None.', tags:['Zone control']},
    };
    case 'skirmisher': return {
      postureA:{trigger:'Target is isolated or below half HP', movement:'Moves to flank or gain cover on the softest visible target.', action:'Attacks with melee if adjacent, otherwise uses its ranged option.', bonusAction:'None — commits to the attack.', tags:['Focus: Soft target']},
      postureB:{trigger:'Below 30% HP or half the group already down', movement:'Disengages and retreats toward cover or allies.', action:'Ranged attack only if a clean shot is available without provoking.', bonusAction:'Hide or Disengage if available.', tags:['Disengage','Hide']},
      postureC:{trigger:'An objective or ally needs protecting', movement:'Repositions to block the path to whatever it is guarding.', action:'Attacks whoever is closing on the objective.', bonusAction:'None.', tags:['Zone control','Protect objective']},
    };
    case 'pack': return {
      postureA:{trigger:'Two or more pack members can reach the same target', movement:'Circles to flank alongside packmates for advantage.', action:'Attacks the target the pack has surrounded.', bonusAction:'None.', tags:['Pack Tactics','Flanking']},
      postureB:{trigger:'Half the pack is down or it is alone', movement:'Falls back toward remaining packmates rather than fighting solo.', action:'Only attacks if cornered.', bonusAction:'None.', tags:['Regroup']},
      postureC:{trigger:'Prey is fleeing', movement:'Drives the target toward the rest of the pack.', action:'Harassing attacks to slow escape rather than finish the kill alone.', bonusAction:'None.', tags:['Herd','Cut off retreat']},
    };
    case 'mindless': return {
      postureA:{trigger:'A living creature is within range', movement:'Shambles directly toward the nearest living creature, ignoring danger.', action:'Attacks whatever is closest.', bonusAction:'None.', tags:['No tactics','No morale']},
      postureB:{trigger:'Reduced to 0 HP', movement:'N/A — has no self-preservation instinct and never willingly retreats.', action:'Continues attacking until destroyed.', bonusAction:'None.', tags:['Fights to destruction']},
      postureC:{trigger:'Multiple living creatures are present', movement:'Moves toward whichever is nearest, regardless of threat level.', action:'Attacks without prioritizing softer or harder targets.', bonusAction:'None.', tags:['No target priority']},

      postureC:{trigger:'A second target wanders near', movement:'Uses terrain or disguise to bait the new target closer.', action:'Switches targets to whichever creature is most isolated.', bonusAction:'None.', tags:['Bait','Re-target']},
    };
    case 'leader': return {
      postureA:{trigger:'Allies are still standing', movement:'Stays with the group, positioning to support rather than lead the charge.', action:'Attacks alongside allies, focusing fire on whatever they have targeted.', bonusAction:"Directs an ally's attack or movement if it has the trait for it.", tags:['Focus fire','Command']},

    };
    default: return generatePostures('skirmisher');
  }

function findSrdMonster(query, extra){
  const q = query.trim().toLowerCase();
  if(!q) return undefined;
  const pool = extra && extra.length ? [...extra, ...srdMonsters] : srdMonsters;
  return pool.find(m=>m.name.toLowerCase()===q) ?? pool.find(m=>m.name.toLowerCase().startsWith(q));
}

function passivesToTraitDetails(passives){
  return passives.map(p=>{
    const base = p.replace(/\s*\([^)]*\)\s*$/,'').trim();
    const desc = TRAIT_TEXT[base] || TRAIT_TEXT[p];
    return desc ? {name:p, description:desc} : {name:p, description:''};
  }).filter(t=>t.description);
}

function buildMonsterFromName(rawName, idSuffix, overrides, extraTemplates){
  const lookupName = rawName.trim().replace(/\s+\d+$/, '');
  const template = findSrdMonster(lookupName, extraTemplates);
  const name = rawName.trim() || 'Unnamed Creature';
  const base = template
    ? {baseType:template.baseType, ac:template.ac, hpMax:template.hpMax, speed:template.speed, abilityScores:template.abilityScores, passives:template.passives, traitDetails:template.traitDetails, savingThrows:template.savingThrows, resistances:template.resistances, vulnerabilities:template.vulnerabilities, attacks:template.attacks, spellcasting:template.spellcasting, style:template.style}
    : {baseType:'Custom entry — no SRD match', ac:10, hpMax:10, speed:30, abilityScores:defaultAbilities, passives:[], attacks:[], style:'skirmisher'};
  const ac = overrides?.ac ?? base.ac;
  const hpMax = overrides?.hpMax ?? base.hpMax;

    id: template ? `${template.name.toLowerCase().replace(/[^a-z0-9]+/g,'-')}-${idSuffix}` : `custom-${idSuffix}-${customMonsterCounter}`,
    name, baseType: base.baseType, ac, hpCurrent: hpMax, hpMax, speed, abilityScores: base.abilityScores,

    reactionCue: template ? 'Autofilled from the local compendium — review before running.' : 'No stat block found in the local compendium — stats entered manually.',
    style: base.style, ...generatePostures(base.style), activePosture:'A', isDefeated:false,
  };
}

const TAG_KEYWORDS = {

  dungeon:['dungeon','corridor','vault','chamber','keep','fortress'], crypt:['crypt','tomb','grave','mausoleum','catacomb'],
  ruins:['ruin','ruins','temple','abandoned','derelict'], urban:['city','town','street','alley','rooftop','tavern','urban','market'],
  sewer:['sewer','drain','gutter'], road:['road','path','trail','crossroads','highway'], hills:['hill','hills'],
  mountain:['mountain','peak','cliff','pass','summit'], desert:['desert','dune','sand','wasteland'], swamp:['swamp','marsh','bog','mire'],
  tundra:['tundra','snow','ice','glacier','frozen'], water:['water','river','lake','sea','ocean','flood','flooded','cellar','lagoon'],
};
const MAP_ELEMENTS = {
  forest:['Broken canopy for partial cover/concealment','Root snarls or undergrowth as difficult terrain','A fallen tree or streambed as a natural chokepoint'],
  cave:['Stalagmites/stalactites for cover and difficult terrain','Narrow tunnels as chokepoints','Uneven footing — consider a Dex save hazard for rushing in'],
  dungeon:['Doorways and corridors as chokepoints','Rubble or collapsed sections as difficult terrain','A trap or pressure plate tied to the hazard/clock'],
  crypt:['Sarcophagi or alcoves for cover and ambush spots','Narrow burial corridors as chokepoints','A ritual circle or altar as a possible hazard focus'],
  ruins:['Broken walls and rubble for cover','A partially collapsed floor as dangerous terrain','Elevation changes from crumbled stairs'],
  urban:['Rooftops and alleys for verticality and flanking routes','Crowds or stalls the party may need to avoid harming','Windows and doorways as entry/escape routes'],
  sewer:['Narrow walkways over water as difficult terrain','Grates and tunnels as chokepoints','Poor visibility — consider dim light or darkness'],
  road:['Wagons, carts, or roadside rocks for cover','Open ground favoring ranged combatants','A ditch or treeline flanking the road for ambushers'],
  hills:['Elevation for a high-ground advantage','Loose scree as difficult terrain','Long sightlines favoring ranged attackers'],
  mountain:['Narrow ledges and drop-offs — consider a fall hazard','Elevation and high-ground advantage','Wind or weather as an environmental factor'],
  desert:['Dunes for concealment and difficult terrain','Heat/exhaustion as a slow-building hazard','Long sightlines favoring ranged attackers'],
  swamp:['Difficult terrain from mud and standing water','Poor visibility from fog or reeds','A submerged hazard (quicksand, leeches)'],
  tundra:['Difficult terrain from snow and ice','Cold as an environmental hazard','Poor visibility in whiteout conditions'],
  water:['Difficult terrain / swimming rules in deep water','A current or rising tide as an escalating hazard',"Limited footing for anyone who can't swim"],
};
const TIME_NOTES = {
  dusk:'Dim light — consider granting darkvision creatures an edge over PCs without it.', night:'Darkness — torches become a tactical resource.',
  midnight:'Darkness — torches become a tactical resource.', dawn:'Low light and long shadows — a good excuse for an ambush.',
  morning:'Full visibility — no lighting penalty to plan around.', noon:'Full visibility, and bright light if that matters to any trait.',
  afternoon:'Full visibility — no lighting penalty to plan around.',
};
function detectTags(scene){
  const text = `${scene.environment} ${scene.terrain} ${scene.combatSituation}`.toLowerCase();
  const tags = [];
  for(const [tag, keywords] of Object.entries(TAG_KEYWORDS)) if(keywords.some(k=>text.includes(k))) tags.push(tag);
  return tags;
}
function suggestMapElements(scene){
  const tags = detectTags(scene);
  const elements = [];
  if(tags.length === 0){ elements.push('Add a few words to Environment or Terrain above for tailored suggestions.'); elements.push('Generic default: aim for at least one chokepoint and one piece of cover per 2 PCs.'); }
  else tags.forEach(tag=>elements.push(...(MAP_ELEMENTS[tag] ?? [])));
  const timeKey = scene.timeOfDay.trim().toLowerCase();
  const timeNote = Object.entries(TIME_NOTES).find(([k])=>timeKey.includes(k))?.[1];
  if(timeNote) elements.push(timeNote);
  return [...new Set(elements)];
}

    hazard:'Rally Point', trigger:'If the leader is threatened, expect a retreat/rally order rather than accepting the loss.'},
};
function suggestAxes(monsters, scene){
  const living = monsters.filter(m=>!m.isDefeated);
  const tally = new Map();
  living.forEach(m=>{ if(m.style) tally.set(m.style, (tally.get(m.style) ?? 0) + 1); });
  const dominant = [...tally.entries()].sort((a,b)=>b[1]-a[1])[0]?.[0] ?? 'skirmisher';
  const preset = AXES_PRESETS[dominant];
  const names = living.map(m=>m.name).join(', ') || 'the monsters';
  const terrain = scene.terrain.trim(); const situation = scene.combatSituation.trim();
  return {
    winCondition:{ title:preset.win, description:`${preset.winDesc}${situation?` Context: ${situation}.`:''} (Roster: ${names})`, moraleThresholds:preset.morale },
    battlefieldOptimizer:{ title:preset.optimizer, description:`${preset.optDesc}${terrain?` Terrain on hand: ${terrain}.`:' No terrain notes yet.'}`, mechanicalBenefit:preset.benefit },
    hazardOrClock:{ title:preset.hazard, initiativeCount:20, triggerEffect:preset.trigger },
  };
}

/* ---------- helpers ---------- */
const SENSE_MOVEMENT_PATTERN = /darkvision|blindsight|truesight|tremorsense|passive perception|flyer|fly \d|swim(ming)? \d|climb(ing)? \d|burrow(ing)? \d/i;
function splitSensesFromPassives(passives){
  const senses = [], other = [];
  for(const p of passives) (SENSE_MOVEMENT_PATTERN.test(p) ? senses : other).push(p);
  return {senses, other};
}
function clampPct(cur, max){ return max<=0 ? 0 : Math.max(0, Math.min(1, cur/max)); }
function hpColor(pct){ if(pct<=0) return 'var(--line)'; if(pct<=0.3) return 'var(--blood)'; if(pct<=0.6) return 'var(--amber)'; return 'var(--moss)'; }
function abilityMod(score){ const mod = Math.floor((score-10)/2); return mod>=0?`+${mod}`:`${mod}`; }
const POSTURE_META = { A:{label:'Offensive', color:'var(--blood)', soft:'var(--blood-soft)'}, B:{label:'Defensive', color:'var(--arcane)', soft:'var(--arcane-soft)'}, C:{label:'Hazard', color:'var(--amber)', soft:'var(--amber-soft)'} };
function computeAutoPosture(m){ if(m.hpMax<=0) return m.activePosture; const pct = m.hpCurrent/m.hpMax; if(pct<=0.3) return 'B'; return m.activePosture==='B' ? 'A' : m.activePosture; }

/** Combined PC + monster turn order, sorted by initiative (highest first). Defeated monsters are dropped; PCs always stay in the order. */
function getTurnOrder(encounter){
  const pcs = encounter.party.map(p=>({ id:p.id, name:p.name, initiative: p.initiative ?? 10, kind:'pc' }));
  const mons = encounter.round.monsters.filter(m=>!m.isDefeated).map(m=>({ id:m.id, name:m.name, initiative: m.initiative ?? 10, kind:'monster' }));
  return [...pcs, ...mons].sort((a,b)=> b.initiative - a.initiative);
}

function SceneFieldsStrip({scene, onChange, onGenerate}){
  const fields = [
    ['environment','Environment','e.g. flooded cellar, mountain pass, city rooftops'],
    ['terrain','Terrain','e.g. difficult terrain, chokepoints, cover'],
    ['combatSituation','Combat Situation','e.g. ambush, escort, defend the door'],
    ['timeOfDay','Time of Day','e.g. dusk, midnight, high noon'],
  ];
  const [showPaste, setShowPaste] = useState(false);
  const [pasteText, setPasteText] = useState('');
  const [busy, setBusy] = useState(false);
  const [pasteErr, setPasteErr] = useState(null);
  const [sampleApi, setSampleApi] = useState(null);

  useEffect(()=>{
    (async ()=>{
      try{
        if(!window.claude || typeof window.claude.use !== 'function') return;
        const s = await window.claude.use('sample');
        if(s) setSampleApi(s);
      }catch(e){}
    })();
  }, []);

  async function fillFromDescription(){
    if(!pasteText.trim()) return;
    setBusy(true); setPasteErr(null);
    if(sampleApi){
      try{
        const prompt = 'Split this D&D scene description into a JSON object with exactly these string keys: '
          + '"environment" (the place/setting), "terrain" (physical features — cover, elevation, difficult terrain), '
          + '"combatSituation" (why a fight is happening — ambush, escort, defend, etc.), "timeOfDay" (time of day/lighting, or "" if not mentioned). '
          + 'Use short phrases, not full sentences. Reply with ONLY the JSON object.\n\nDescription:\n' + pasteText;
        const data = await sampleJson(sampleApi, prompt, {modelTier:'quick'});
        onChange({
          environment: String(data.environment ?? ''),
          terrain: String(data.terrain ?? ''),
          combatSituation: String(data.combatSituation ?? ''),
          timeOfDay: String(data.timeOfDay ?? ''),
        });
        setPasteText(''); setShowPaste(false); setBusy(false);
        return;
      }catch(e){ /* fall through to the local heuristic below */ }
    }
    // No sample capability (or it failed) in this view — fall back to a local heuristic:
    // the raw text still feeds map-element/axis suggestions regardless of which field
    // it lands in, so put it all in Combat Situation and pull a time-of-day guess out of it.
    const lower = pasteText.toLowerCase();
    const timeHit = Object.keys(TIME_NOTES).find(k=>lower.includes(k));
    onChange({ combatSituation: pasteText.trim(), ...(timeHit ? {timeOfDay: timeHit} : {}) });
    setPasteText(''); setShowPaste(false); setBusy(false);
  }

  return (
    <div className="axis-card" style={{marginTop:12}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:8}}>
        <div className="axis-eyebrow" style={{marginBottom:0}}>

          <span className="eyebrow" style={{color:'var(--amber)'}}>Scene Notes</span>
        </div>
        <button className="disclosure-toggle" style={{width:'auto', padding:'5px 9px', border:'1px solid var(--line)'}} onClick={()=>setShowPaste(v=>!v)}>
          <Icon name="clip" size={13}/> {showPaste ? 'Cancel' : 'Paste a Description Instead'}
        </button>
      </div>

      {showPaste && (
        <div style={{marginTop:10, display:'flex', flexDirection:'column', gap:8}}>
          <textarea className="text-input" style={{height:90, fontFamily:'inherit', fontSize:13.5}}
            placeholder="Paste or type a free-form description of the scene — e.g. &quot;Goblins ambush the party at dusk in an old-growth forest, using root snarls and a creek for cover.&quot;"
            value={pasteText} onChange={e=>setPasteText(e.target.value)}/>
          {pasteErr && <div className="error-box"><Icon name="alert" size={13}/><p>{pasteErr}</p></div>}
          <p style={{fontSize:11.5, color:'var(--parchment-faint)'}}>
            {sampleApi ? 'This page will ask Claude to split it into the fields below.' : "This view can't ask Claude to split it automatically, so it'll go straight into Combat Situation (which still feeds the map/axis suggestions) — pull out Environment/Terrain by hand if you want them separate."}
          </p>
          <button className="add-btn" disabled={!pasteText.trim() || busy} onClick={fillFromDescription}>
            <Icon name="sparkles" size={14}/>{busy ? 'Filling…' : 'Fill Fields'}

        </div>
      )}

      <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px,1fr))', gap:10, marginTop:10}}>

            <input className="text-input" value={scene[key]} onChange={e=>onChange({[key]:e.target.value})} placeholder={placeholder}/>
          </div>
        ))}
      </div>
      <button className="add-btn" style={{marginTop:12, borderColor:'var(--blood)', background:'var(--blood-soft)', color:'var(--blood-text)'}} onClick={onGenerate}>
        <Icon name="sparkles" size={16}/>Draft Axes from Scene
      </button>
      <p style={{fontSize:12, color:'var(--parchment-faint)', marginTop:6}}>Drafts the axes above from this scene text and whatever's currently in the fight — doesn't add monsters itself.</p>
    </div>
  );
}

      </div>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:8}}>
        <p className="axis-title">{hazard.title}</p>
        <HazardBadge value={hazard.initiativeCount} color={color}/>
      </div>
      <p className="axis-note" style={{'--c':color, color:textColor}}>{hazard.triggerEffect}</p>
      <div style={{display:'flex', gap:6, marginTop:10, flexWrap:'wrap'}}>
        <button className="btn" onClick={randomize} disabled={locked} title={locked?'Locked — unlock to randomize':'Pick a random environmental hazard'}>
          <Icon name="sparkles" size={13}/>Randomize
        </button>
        <button className="disclosure-toggle" style={{width:'auto', padding:'6px 9px', border:'1px solid var(--line)'}} onClick={()=>setShowAdd(v=>!v)}>
          {showAdd ? 'Cancel' : '+ Add Hazard'}
        </button>
      </div>
      {showAdd && (
        <div style={{marginTop:8, display:'flex', flexDirection:'column', gap:6}}>
          <input className="text-input" placeholder="Hazard name" value={title} onChange={e=>setTitle(e.target.value)}/>
          <textarea className="text-input" style={{height:70, fontFamily:'inherit', fontSize:13.5}} placeholder="What happens when it triggers…" value={trigger} onChange={e=>setTrigger(e.target.value)}/>
          <div style={{display:'flex', gap:10, alignItems:'center', flexWrap:'wrap'}}>
            <label style={{fontSize:13, display:'flex', gap:5, alignItems:'center', color:'var(--parchment-dim)'}}>
              <input type="checkbox" checked={roundEnd} onChange={e=>setRoundEnd(e.target.checked)}/>
              Round End (not count-based)
            </label>
            {!roundEnd && <input className="text-input" style={{width:70}} value={count} onChange={e=>setCount(e.target.value)} placeholder="Count"/>}
          </div>
          <button className="add-btn" disabled={!title.trim()||!trigger.trim()} onClick={saveNew}>Save &amp; Apply</button>
        </div>
      )}
      {customHazards.length > 0 && (
        <div style={{marginTop:10}}>
          <p style={{fontSize:11.5, fontWeight:700, letterSpacing:'.09em', textTransform:'uppercase', color:'var(--parchment-faint)', margin:'0 0 5px'}}>My Hazards</p>
          <div style={{display:'flex', flexWrap:'wrap', gap:5}}>
            {customHazards.map(h=>(
              <span key={h.title} className="tag" style={{display:'inline-flex', alignItems:'center', gap:5, padding:'3px 4px 3px 9px', cursor:'pointer'}} onClick={()=>onApply(h)} title="Click to apply">
                {h.title}
                <button className="icon-btn" style={{padding:0}} onClick={ev=>{ev.stopPropagation(); onRemoveCustom(h.title);}} aria-label={`Remove ${h.title} from My Hazards`}><Icon name="x" size={11}/></button>
              </span>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function AxesStrip({axes, monsters, scene, onSuggest, onSceneChange, onGenerate, onRollCombatMenu, onRollWinCondition, onRollBattlefieldOptimizer, locked, onToggleLock, customHazards, onApplyHazard, onSaveCustomHazard, onRemoveCustomHazard}){

    {key:'win', eyebrow:'Win Condition', color:'var(--blood)', textColor:'var(--blood-text)', icon:null, title:axes.winCondition.title, desc:axes.winCondition.description, note:axes.winCondition.moraleThresholds, onRoll:onRollWinCondition},
    {key:'opt', eyebrow:'Battlefield Optimizer', color:'var(--arcane)', textColor:'var(--arcane-text)', icon:'mountain', title:axes.battlefieldOptimizer.title, desc:axes.battlefieldOptimizer.description, note:axes.battlefieldOptimizer.mechanicalBenefit, onRoll:onRollBattlefieldOptimizer},
  ];
  return (
    <div className="axes-strip">
      <div className="axes-head">
        <h2><Icon name="compass" size={17} style={{color:'var(--amber)'}}/>Encounter Axes</h2>
        <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
          <button className="btn" onClick={onRollCombatMenu} title="Roll a fresh Win Condition + Battlefield Optimizer (Tabletop University's Combat Axis Menu)">
            <Icon name="sparkles" size={14}/>Roll Combat Menu
          </button>

      </div>
      <div className="axes-grid">

            <div className="axis-eyebrow" style={{justifyContent:'space-between'}}>

                  <Icon name={isLocked?'lock':'unlock'} size={13}/>
                </button>
                <button className="icon-btn" onClick={c.onRoll} disabled={isLocked} aria-label={`Roll a new ${c.eyebrow}`} title={isLocked?'Locked — unlock to roll a new one':`Roll a new ${c.eyebrow} — keeps the other axes as-is`}>

function RoundTracker({round, order, onNextTurn, onPrevRound, onNextRound, onReset}){
  const active = order.find(c=>c.id===round.activeCombatantId) ?? order[0];
  return (
    <div className="roundbar">
      <div className="roundbar-top">
        <div className="roundbar-stats">
          <div><p className="stat-label">Round</p><p className="stat-value mono">{round.roundNumber}</p></div>
          <div className="stat-divider"/>
          <div><p className="stat-label">Active</p><p className="active-name">{active ? active.name : '—'}</p></div>
        </div>
        <div className="roundbar-actions">
          <button className="btn" onClick={onReset}><Icon name="reset" size={15}/>Reset</button>
          <button className="btn" onClick={onPrevRound}><Icon name="chevron" size={15} style={{transform:'scaleX(-1)'}}/>Previous Round</button>
          <button className="btn btn-arcane" onClick={onNextTurn}><Icon name="chevron" size={15}/>Next Turn</button>
          <button className="btn btn-blood" onClick={onNextRound}><Icon name="skip" size={15}/>Next Round</button>
        </div>
      </div>
      {order.length > 0 && (
        <div className="init-track">
          {order.map(c=>(
            <span key={c.id} className={"init-chip"+(c.id===active?.id?" active":"")+(c.kind==='pc'?" pc":" monster")}>
              <span className="init-num mono">{c.initiative}</span>{c.name}
            </span>
          ))}
        </div>
      )}
    </div>
  );
}

function PostureDetail({posture, color}){

function AbilityRow({monster}){
