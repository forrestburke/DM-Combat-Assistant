      <div className="mcard-collapsed-meta" onClick={e=>e.stopPropagation()}>
        {monster.isMob ? (
          <div className="mob-count-row">
            <span className="mob-count-label">Still alive</span>
            <button className="stepper" onClick={()=>onSetStats(monster.id, {mobCount: Math.max(0, (monster.mobCount||1)-1)})} aria-label="Decrease mob size" title="One fewer left in the mob">−</button>
            <input className="init-input" type="number" value={monster.mobCount ?? 1} onChange={e=>onSetStats(monster.id, {mobCount: Math.max(0, Number(e.target.value)||0)})} aria-label={`${monster.name} mob size`} title="Adjust as members of the mob are killed"/>
            <button className="stepper" onClick={()=>onSetStats(monster.id, {mobCount: (monster.mobCount||1)+1})} aria-label="Increase mob size" title="One more joins the mob">+</button>
          </div>
        ) : <HpBar current={monster.hpCurrent} max={monster.hpMax} height={8}/>}
        <div className="mcard-meta-row">
          <label className="init-label" title="Initiative">
            <span>Init</span>
            <input className="init-input" type="number" value={monster.initiative ?? 10} onChange={e=>onSetStats(monster.id, {initiative: Number(e.target.value)||0})} aria-label={`${monster.name} initiative`}/>
          </label>
          {!monster.isMob && (
            <label className="init-label wide" title="Damage or heal this monster — type a negative number to damage, a positive number to heal, then press Enter to apply">
              <span>HP Adjust</span>
              <input className="text-input hp-delta wide" type="number" value={deltaVal} onChange={e=>setDeltaVal(e.target.value)}
                onKeyDown={e=>{ if(e.key==='Enter') applyDelta(); }} placeholder="-8 or 5" aria-label={`Apply HP change to ${monster.name} — press Enter to apply`}/>
            </label>
          )}
          <span className="posture-chip" style={{'--c':meta.color, '--c-soft':meta.soft}} title={`Currently on Posture ${monster.activePosture}: ${meta.label} — click A, B, or C below to switch`}>{monster.activePosture} · {meta.label}</span>
        </div>
        <ConditionRow conditions={monster.conditions} onToggle={c=>onToggleCondition(monster.id, c)}/>
      </div>

      {expanded && (
        <div className="mcard-body">
          {monster.isMob && party.length > 0 && <MobAttackPanel monster={monster} party={party} onDamageParty={onDamageParty}/>}
          {monster.isMob && <MobSavePanel monster={monster}/>}
          <div className="hp-exact-row">
            <span className="hp-exact-label">HP</span>
            <input className="text-input hp-num" type="number" value={monster.hpCurrent} onChange={e=>onSetStats(monster.id, {hpCurrent: Number(e.target.value)||0})} aria-label={`Set ${monster.name} current HP`}/>
            <span className="hp-exact-sep">/</span>
            <input className="text-input hp-num" type="number" value={monster.hpMax} onChange={e=>onSetStats(monster.id, {hpMax: Math.max(1, Number(e.target.value)||1)})} aria-label={`Set ${monster.name} max HP`}/>
            <span className="hp-exact-hint">exact totals — use ±HP above for quick damage/healing</span>
          </div>
          <AbilityRow monster={monster}/>
          {(monster.resistances?.length > 0 || monster.vulnerabilities?.length > 0 || monster.immunities?.length > 0) && (
            <div style={{display:'flex', flexDirection:'column', gap:4, marginBottom:10}}>
              {monster.immunities?.length > 0 && (
                <div className="callout" style={{marginTop:0}}>
                  <Icon name="shield" size={15} style={{color:'var(--moss)'}}/>
                  <p><b style={{color:'var(--moss)'}}>Immune to </b>{monster.immunities.join(', ')}</p>
                </div>
              )}
              {monster.resistances?.length > 0 && (
                <div className="callout" style={{marginTop:0}}>
                  <Icon name="shield" size={15} style={{color:'var(--arcane)'}}/>
                  <p><b style={{color:'var(--arcane-text)'}}>Resistant to </b>{monster.resistances.join(', ')}</p>
                </div>
              )}
              {monster.vulnerabilities?.length > 0 && (
                <div className="callout" style={{marginTop:0}}>
                  <Icon name="alert" size={15} style={{color:'var(--blood)'}}/>
                  <p><b style={{color:'var(--blood-text)'}}>Vulnerable to </b>{monster.vulnerabilities.join(', ')}</p>
                </div>
              )}
            </div>
          )}

          <div className="posture-row">
            {['A','B','C'].map(key=>{
              const active = monster.activePosture===key; const m = POSTURE_META[key];
              return <button key={key} className={"posture-btn"+(active?" active":"")} style={{'--c':m.color,'--c-soft':m.soft}} onClick={()=>onPosture(monster.id,key)} title={`Switch to Posture ${key}: ${m.label}`}>{key} · {m.label}</button>;
            })}
          </div>
          <PostureDetail posture={postures[monster.activePosture]} color={meta.color}/>
          {monster.activePosture==='C' && axes && (
            <div className="axis-live-context">
              <p><b>Right now — Win Condition:</b> {axes.winCondition?.title}</p>
              <p><b>Right now — Hazard/Clock:</b> {axes.hazardOrClock?.title} <span className="mono">(count {axes.hazardOrClock?.initiativeCount})</span> — {axes.hazardOrClock?.triggerEffect}</p>
            </div>
          )}

          <div className="section-label">
            <Icon name="blade" size={14} style={{color:'var(--parchment-faint)'}}/><span>Attacks</span>
            {monster.multiattack && <span className="multiattack-badge" title={monster.multiattackDetails || 'Has a Multiattack action — see the attacks it draws from below.'}>Multiattack</span>}
          </div>
          {monster.multiattack && monster.multiattackDetails && <p className="multiattack-details">{monster.multiattackDetails}</p>}
          {monster.attacks.map(a=>(
            <div className="attack-row" key={a.name}><span className="attack-name">{a.name}</span><span className="attack-stats mono">{a.formula} · {a.damage}</span></div>
          ))}

          {monster.spellcasting && (
            <>
              <div className="section-label"><Icon name="scroll" size={14} style={{color:'var(--parchment-faint)'}}/><span>Spells</span>
                {(monster.spellcasting.ability || monster.spellcasting.dc) && (
                  <span className="spell-meta mono">{[monster.spellcasting.ability, monster.spellcasting.dc?`DC ${monster.spellcasting.dc}`:null].filter(Boolean).join(' · ')}</span>
                )}
              </div>
              {monster.spellcasting.lists.map(l=>(
                <div className="spell-row" key={l.freq}><span className="spell-freq">{l.freq}</span><span className="spell-names">{l.spells.join(', ')}</span></div>
              ))}
            </>
          )}

          <div className="callout reaction"><Icon name="zap" size={15}/><p>{monster.reactionCue}</p></div>
          {otherPassives.length>0 && <div className="callout passive"><Icon name="crosshair" size={15}/><p>{otherPassives.join(' · ')}</p></div>}

          {(monster.traitDetails?.length > 0 || matchedTriggers.length > 0) && (
            <div className="trait-block">
              <span className="lbl">Traits &amp; Triggers</span>
              {monster.traitDetails?.map(t=>(
                <p key={t.name}><b>{t.name}. </b>{t.description}</p>
              ))}
              {matchedTriggers.map(t=>(
                <p key={t.id}><b>{t.name}. </b>When {t.triggerCondition.toLowerCase()} — {t.mechanicalEffect}
                  <span className="trigger-dc mono">{t.formulaOrDC}</span>
                </p>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const TRANSCRIBE_PROMPT = `Please transcribe this D&D 5e monster stat block image into the exact markdown format below. Use official rules text where you can read it; if something is illegible or not shown in the image, infer a sensible tactical option consistent with the monster's abilities rather than leaving it blank. Output ONLY the filled-in block, no extra commentary. Output the result inside a markdown code block.

FORMATTING RULES — do not deviate from these, even if it feels more natural to:
1. Every bullet point starts with a literal hyphen "-". Never use "*", "•", or any other bullet character.
2. Every heading below must keep its exact "###" or "####" prefix. Never drop the # marks or turn a heading into a bold/plain text line.
3. Speed is ONE number only (feet per round walking). If the creature also flies, swims, climbs, or burrows, note the fastest of those separately as a Passives entry, e.g. "Flyer (fly 60 ft)" — never write "30 ft., fly 60 ft." on the Speed line itself.
4. Reaction Cue is a top-level bullet, grouped with AC/HP/Speed at the very top — never nested under Attacks, Traits, or anywhere else.
5. Every Attacks and Spells-save line must have exactly 5 pipe-separated fields in this order: Name | Type | to-hit-or-DC | range | damage. Type must be exactly one of "Melee", "Ranged", or "Save" — nothing else.
6. HP must be written as "current/max" (e.g. "78/78"), never a single number.
7. If the creature has a Multiattack action, add it as its own bullet under #### Traits: "- Multiattack: <what it does>" — the app detects that name specifically to show a Multiattack badge.

### Name (Base Type)
- AC:
- HP: current/max
- CR: (challenge rating, e.g. "5" or "1/4" — used only for the encounter difficulty rating; omit if unknown)
- Speed:
- Ability Scores: STR #, DEX #, CON #, INT #, WIS #, CHA #
- Resistances: (optional, comma-separated — omit line if none)
- Vulnerabilities: (optional, comma-separated — omit line if none)
- Immunities: (optional, comma-separated — damage types and/or conditions together — omit line if none)
- Passives: (comma-separated short names)
- Style: brute / skirmisher / pack / mindless / ambusher / leader (optional — whichever best fits how it fights)

#### Traits
- Trait Name: full rules text

#### Attacks
- Attack Name | Melee/Ranged/Save | to-hit or DC | range | damage

--- everything below is optional — the app auto-generates it from Style if omitted ---

#### Spells (only include this section if the creature is a spellcaster)
- Ability: the spellcasting ability (e.g. Wisdom)
- DC: the spell save DC
- Cantrips (at will): comma-separated spell names
- 1st Level (N slots): comma-separated spell names
- (repeat one line per frequency/level the stat block lists, spell names only — no spell descriptions)

- Reaction Cue: one sentence on resource/reaction usage

#### Posture A: Offensive
- Trigger:
- Movement:
- Action:
- Bonus Action:
- Tags: comma, separated

#### Posture B: Defensive
- Trigger:
- Movement:
- Action:
- Bonus Action:
- Tags: comma, separated

#### Posture C: Axis Interaction
- Trigger:
- Movement:
- Action:
- Bonus Action:
- Tags: comma, separated`;

function AddMonsterForm({onAdd, customMonsters, onSaveCustom, onRemoveCustom}){
  const [collapsed, setCollapsed] = useState(false);
  const [name, setName] = useState(''); const [count, setCount] = useState('1');
  const [ac, setAc] = useState(''); const [hp, setHp] = useState(''); const [speed, setSpeed] = useState('');
  const [showAdvanced, setShowAdvanced] = useState(false);
  const [mode, setMode] = useState('quick'); // quick | paste
  const [pasteText, setPasteText] = useState(''); const [pasteError, setPasteError] = useState(null);
  const [saveOnPaste, setSaveOnPaste] = useState(true);
  const [copied, setCopied] = useState(false);
  const [myMonstersOpen, setMyMonstersOpen] = useState(false);
  const [myMonstersFilter, setMyMonstersFilter] = useState('');
  const [browseOpen, setBrowseOpen] = useState(false);
  const [browseSearch, setBrowseSearch] = useState('');
  const [filterType, setFilterType] = useState('');
  const [filterCr, setFilterCr] = useState('');
  const [filterEnv, setFilterEnv] = useState('');
  const [filterSize, setFilterSize] = useState('');
  const [suggestOpen, setSuggestOpen] = useState(false);
  const [asMob, setAsMob] = useState(false);

  const match = findSrdMonster(name, customMonsters);
  const nameSuggestions = useMemo(() => {
    const q = name.trim().toLowerCase();
    if(!q) return [];
    const pool = [...customMonsters, ...srdMonsters];
    const seen = new Set();
    const starts = [], contains = [];
    for(const m of pool){
      if(seen.has(m.name)) continue;
      const lower = m.name.toLowerCase();
      if(lower.startsWith(q)){ seen.add(m.name); starts.push(m); }
      else if(lower.includes(q)){ seen.add(m.name); contains.push(m); }
    }
    return [...starts, ...contains].slice(0, 8);
  }, [name, customMonsters]);
  function pickNameSuggestion(m){ setName(m.name); setSuggestOpen(false); }

  const parseBaseType = (baseType) => {
    const noSub = baseType.replace(/\s*\([^)]*\)\s*$/, '').trim();
    const [size, ...rest] = noSub.split(' ');
    return { size, type: rest.join(' ') || noSub };
  };
  const browseOptions = useMemo(() => {
    const types = new Set(), sizes = new Set(), crs = new Set(), envs = new Set();
    srdMonsters.forEach(m => {
      const {size, type} = parseBaseType(m.baseType);
      if(type) types.add(type); if(size) sizes.add(size);
      if(m.cr != null) crs.add(m.cr);
      (m.environments||[]).forEach(e=>envs.add(e));
    });
    return {
      types: [...types].sort(),
      sizes: ['Tiny','Small','Medium','Large','Huge','Gargantuan'].filter(s=>sizes.has(s)),
      crs: [...crs].sort((a,b)=>a-b),
      envs: [...envs].sort(),
    };
  }, []);
  const browseResults = useMemo(() => {
    if(!browseOpen) return [];
    const q = browseSearch.trim().toLowerCase();
    return srdMonsters.filter(m => {
      const {size, type} = parseBaseType(m.baseType);
      if(filterType && type !== filterType) return false;
      if(filterSize && size !== filterSize) return false;
      if(filterCr && String(m.cr) !== filterCr) return false;
      if(filterEnv && !(m.environments||[]).includes(filterEnv)) return false;
      if(q && !m.name.toLowerCase().includes(q)) return false;
      return true;
    }).slice(0, 200);
  }, [browseOpen, browseSearch, filterType, filterCr, filterEnv, filterSize]);
  function pickBrowseResult(m){
    setName(m.name);
    setBrowseOpen(false);
  }

  useEffect(()=>{
    if(match){ setAc(String(match.ac)); setHp(String(match.hpMax)); setSpeed(String(match.speed)); }
  }, [match?.name]);

  function copyPrompt(){
    navigator.clipboard?.writeText(TRANSCRIBE_PROMPT).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false), 2000); });
  }

  function handleQuickAdd(){
    if(!name.trim()) return;
    const suffix = Date.now();
    const overrides = { ac: ac.trim()?Number(ac):undefined, hpMax: hp.trim()?Number(hp):undefined, speed: speed.trim()?Number(speed):undefined };
    if(asMob){
      const mobSize = Math.max(2, Math.min(50, Number(count) || 2));
      const mob = buildMonsterFromName(name.trim(), suffix, overrides, customMonsters);
      onAdd({...mob, name:`${name.trim()} Mob`, isMob:true, mobCount:mobSize});
    } else {
      const qty = Math.max(1, Math.min(12, Number(count) || 1));
      for(let i=0;i<qty;i++){ const label = qty>1?`${name.trim()} ${i+1}`:name.trim(); onAdd(buildMonsterFromName(label, `${suffix}-${i}`, overrides, customMonsters)); }
    }
    setName(''); setCount('1'); setAc(''); setHp(''); setSpeed('');
  }

  function handlePasteAdd(){
    try{
      const monster = parseSingleMonsterMarkdown(pasteText);
      onAdd(monster);
      if(saveOnPaste) onSaveCustom(monsterToTemplate(monster));
      setPasteText(''); setPasteError(null); setMode('quick');
    }
    catch(e){ setPasteError(e instanceof MarkdownParseError ? e.message : 'Unexpected error while parsing the stat block.'); }
  }

  return (
    <div className="plate">
      <div className="plate-head" style={{cursor:'pointer'}} onClick={()=>setCollapsed(v=>!v)}>
        <Icon name="chevron" size={15} className={"chevron"+(!collapsed?" open":"")}/>
        <Icon name="swords" size={17} style={{color:'var(--blood)'}}/>
        <h2 style={{flex:1}}>Add Monster</h2>
      </div>
      {!collapsed && <div style={{padding:'12px 14px'}}>
      <div className="tab-row">
        <button className={"tab-btn"+(mode==='quick'?' active':'')} onClick={()=>setMode('quick')} title="Add a monster by name, matched against the SRD compendium and your saved monsters">Quick Add</button>
        <button className={"tab-btn"+(mode==='paste'?' active':'')} onClick={()=>setMode('paste')} title="Add a monster by pasting a full stat block in markdown format">Paste Stat Block</button>
      </div>

      {mode === 'quick' && (
        <div style={{display:'flex', flexDirection:'column', gap:10, width:'100%'}}>
          <div style={{display:'flex', alignItems:'center', gap:8}}>
            <div className="name-suggest-wrap" style={{flex:1, minWidth:0, position:'relative'}}>
              <input className="text-input" style={{width:'100%'}} value={name}
                onChange={e=>{ setName(e.target.value); setSuggestOpen(true); }}
                onFocus={()=>setSuggestOpen(true)}
                onBlur={()=>setTimeout(()=>setSuggestOpen(false), 120)}
                onKeyDown={e=>{ if(e.key==='Escape') setSuggestOpen(false); if(e.key==='Enter' && nameSuggestions.length) pickNameSuggestion(nameSuggestions[0]); }}
                placeholder="Monster name…" title="Type to search the SRD compendium and your saved monsters — pick a suggestion or keep typing"/>
              {suggestOpen && nameSuggestions.length > 0 && (
                <div className="name-suggest-list">
                  {nameSuggestions.map(m=>(
                    <button key={m.name} type="button" className="name-suggest-row" onMouseDown={e=>e.preventDefault()} onClick={()=>pickNameSuggestion(m)}>
                      <span className="name-suggest-name">{m.name}</span>
                      <span className="name-suggest-meta">{m.baseType}{m.cr!=null?` · CR ${crLabel(m.cr)}`:''}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <label style={{display:'flex', alignItems:'center', gap:5, flexShrink:0}} htmlFor="qty-input">
              <span style={{fontSize:11.5, color:'var(--parchment-faint)', whiteSpace:'nowrap'}}>{asMob?'Size':'Qty'}</span>
              <input id="qty-input" className="text-input qty" value={count} onChange={e=>setCount(e.target.value)} aria-label={asMob?'Mob size':'Quantity'} title={asMob?'How many identical creatures make up this mob (2-50)':'How many copies to add (1-12)'}/>
            </label>
            <button className="add-btn" style={{flexShrink:0}} disabled={!name.trim()} onClick={handleQuickAdd} title="Add this monster to the encounter"><Icon name="swords" size={16}/>Add</button>
          </div>
          <label style={{display:'flex', alignItems:'center', gap:6, fontSize:12, color:'var(--parchment-dim)', cursor:'pointer'}} title="Instead of adding separate cards, group them into one mob card with a headcount and a Mob Attack resolver that works out the to-hit number and statistical average against one target at once">
            <input type="checkbox" checked={asMob} onChange={e=>{ setAsMob(e.target.checked); if(e.target.checked && Number(count)<=1) setCount('10'); }}/>
            Add as a mob (one card, resolves all attacks against a target at once)
          </label>
          <p className="hint" style={{margin:0}}>{name.trim()===''?'Matches SRD + your saved monsters — autofills AC/HP/Speed/attacks/posture.':match?`Matched: ${match.name} (${match.baseType}${match.cr!=null?`, CR ${crLabel(match.cr)}`:''})${customMonsters.some(c=>c.name===match.name)?' — from your library':''}`:'No match — set stats manually below.'}</p>

          <div>
            <button className="disclosure-toggle" style={{width:'auto', padding:'6px 10px', border:'1px solid var(--line)'}} onClick={()=>setBrowseOpen(v=>!v)} title="Browse the compendium by Type, CR, Environment, or Size instead of typing a name">
              <Icon name="scroll" size={14}/> {browseOpen ? 'Hide Browse' : 'Browse Compendium'} ({srdMonsters.length})
            </button>
            {browseOpen && (
              <div style={{marginTop:8, border:'1px solid var(--line)', padding:10, background:'var(--panel)'}}>
                <input className="text-input" style={{marginBottom:8, fontSize:12.5}} value={browseSearch} onChange={e=>setBrowseSearch(e.target.value)}
                  placeholder={`Search ${srdMonsters.length} monsters by name…`} title="Filter the list below by name"/>
                <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(120px,1fr))', gap:6, marginBottom:8}}>
                  <select className="text-input" value={filterType} onChange={e=>setFilterType(e.target.value)} title="Filter by creature type">
                    <option value="">Any Type</option>
                    {browseOptions.types.map(t=><option key={t} value={t}>{t}</option>)}
                  </select>
                  <select className="text-input" value={filterSize} onChange={e=>setFilterSize(e.target.value)} title="Filter by size">
                    <option value="">Any Size</option>
                    {browseOptions.sizes.map(s=><option key={s} value={s}>{s}</option>)}
                  </select>
                  <select className="text-input" value={filterCr} onChange={e=>setFilterCr(e.target.value)} title="Filter by Challenge Rating">
                    <option value="">Any CR</option>
                    {browseOptions.crs.map(c=><option key={c} value={c}>CR {crLabel(c)}</option>)}
                  </select>
                  <select className="text-input" value={filterEnv} onChange={e=>setFilterEnv(e.target.value)} title="Filter by environment">
                    <option value="">Any Environment</option>
                    {browseOptions.envs.map(e=><option key={e} value={e}>{e[0].toUpperCase()+e.slice(1)}</option>)}
                  </select>
                </div>
                <div className="browse-results">
                  {browseResults.length === 0 && <p className="hint" style={{margin:'6px 0'}}>No matches — try loosening a filter.</p>}
                  {browseResults.map(m=>(
                    <button key={m.name} className="browse-row" onClick={()=>pickBrowseResult(m)} title={`Select ${m.name}`}>
                      <span className="browse-row-name">{m.name}</span>
                      <span className="browse-row-meta">{m.baseType} · CR {crLabel(m.cr)}</span>
                    </button>
                  ))}
                </div>
                {browseResults.length === 200 && <p className="hint" style={{margin:'6px 0 0'}}>Showing the first 200 matches — narrow the filters or search to see more precisely.</p>}
              </div>
            )}
          </div>

          <div>
            <button className="disclosure-toggle" style={{width:'auto', padding:'6px 10px', border:'1px solid var(--line)'}} onClick={()=>setShowAdvanced(v=>!v)} title="Override AC, HP, or Speed before adding, instead of using the matched values">{showAdvanced?'Hide manual stats':'Manual stats (AC / HP / Speed)'}</button>
            {showAdvanced && (
              <div style={{display:'flex', gap:8, marginTop:8}}>
                <input className="text-input" value={ac} onChange={e=>setAc(e.target.value)} placeholder="AC" style={{width:70}} title="Override Armor Class"/>
                <input className="text-input" value={hp} onChange={e=>setHp(e.target.value)} placeholder="HP" style={{width:70}} title="Override max HP"/>
                <input className="text-input" value={speed} onChange={e=>setSpeed(e.target.value)} placeholder="Speed" style={{width:80}} title="Override Speed"/>
              </div>
            )}
          </div>

          {customMonsters.length > 0 && (
            <div>
              <button className="disclosure-toggle" style={{width:'auto', padding:0, border:'none', background:'none', display:'flex', alignItems:'center', gap:5}} onClick={()=>setMyMonstersOpen(v=>!v)} title={myMonstersOpen ? 'Hide your saved monster library' : 'Show your saved monster library'}>
                <Icon name="chevron" size={13} className={"chevron"+(myMonstersOpen?" open":"")}/>
                <span style={{fontSize:11.5, fontWeight:700, letterSpacing:'.09em', textTransform:'uppercase', color:'var(--parchment-faint)'}}>My Monsters ({customMonsters.length})</span>
              </button>
              {myMonstersOpen && (
                <div style={{marginTop:7}}>
                  {customMonsters.length > 8 && (
                    <input className="text-input" style={{marginBottom:7, fontSize:12.5, padding:'5px 8px'}} value={myMonstersFilter}
                      onChange={e=>setMyMonstersFilter(e.target.value)} placeholder={`Filter ${customMonsters.length} saved monsters…`} title="Filter your saved monster library by name"/>
                  )}
                  <div className="my-monsters-list">
                    {customMonsters.filter(m=>m.name.toLowerCase().includes(myMonstersFilter.toLowerCase())).map(m=>(
                      <span key={m.name} className="tag" style={{display:'inline-flex', alignItems:'center', gap:5, padding:'3px 4px 3px 9px'}}>
                        {m.name}
                        <button className="icon-btn" style={{padding:0}} onClick={()=>onRemoveCustom(m.name)} aria-label={`Remove ${m.name} from My Monsters`} title={`Remove ${m.name} from your saved library`}><Icon name="x" size={13}/></button>
                      </span>
                    ))}
                  </div>
                </div>
              )}
            </div>
          )}
        </div>
      )}

      {mode === 'paste' && (
        <div style={{display:'flex', flexDirection:'column', gap:8}}>
          <p style={{fontSize:12, color:'var(--parchment-faint)'}}>Paste a stat block in the markdown format below. Only the top section (a normal stat block) is required; Reaction Cue and the three Postures are optional tactical notes — leave them out and they'll be auto-generated from the monster's style. Got a stat block from a screenshot instead? Use "Copy Transcription Prompt" below to get a ready-made prompt for any AI chat, then paste its reply here.</p>
          <button className="disclosure-toggle" style={{width:'auto', padding:'6px 10px', border:'1px solid var(--line)', alignSelf:'flex-start'}} onClick={copyPrompt} title="Copy a ready-made prompt to your clipboard — hand it, plus a photo of a stat block, to any AI chat">
            <Icon name={copied?'check':'copy'} size={14}/> {copied ? 'Copied!' : 'Copy Transcription Prompt'}
          </button>
          <textarea value={pasteText} onChange={e=>setPasteText(e.target.value)} style={{height:160}}
            placeholder={'### Name (Base Type)\n- AC: 10\n- HP: 20/20\n- Speed: 30\n- Ability Scores: STR 16, DEX 10, CON 15, INT 3, WIS 5, CHA 5\n- Resistances: acid, cold (optional)\n- Vulnerabilities: bludgeoning (optional)\n- Passives: ...\n- Style: brute / skirmisher / pack / mindless / ambusher / leader (optional)\n\n#### Traits\n- Trait Name: full text\n\n#### Attacks\n- Name | Melee | 1d20+5 vs AC | 5 ft | 1d6+3 [bludgeoning]\n\n--- everything below is optional — auto-generated if omitted ---\n\n#### Spells (only for spellcasters)\n- Ability: Wisdom\n- DC: 13\n- Cantrips (at will): Spell One, Spell Two\n- 1st Level (4 slots): Spell Three, Spell Four\n\n- Reaction Cue: ...\n\n#### Posture A: Offensive\n- Trigger: ...\n- Movement: ...\n- Action: ...\n\n#### Posture B: Defensive\n...\n\n#### Posture C: Axis Interaction\n...'}/>
          {pasteError && <div className="error-box"><Icon name="alert" size={16}/><p>{pasteError}</p></div>}
          <label style={{display:'flex', alignItems:'center', gap:6, fontSize:12.5, color:'var(--parchment-dim)'}} title="Keep this monster in your library so you can Quick Add it in future encounters">
            <input type="checkbox" checked={saveOnPaste} onChange={e=>setSaveOnPaste(e.target.checked)}/>
            Save to My Monsters (reuse this one in other encounters)
          </label>
          <button className="add-btn" disabled={!pasteText.trim()} onClick={handlePasteAdd} title="Parse the pasted text and add this monster to the encounter"><Icon name="clip" size={16}/>Parse &amp; Add</button>
        </div>
      )}

      </div>}
    </div>
  );
}

function DataModal({mode, exportText, onImport, onClose}){
  const [text, setText] = useState('');
  const [error, setError] = useState(null);
  const [copied, setCopied] = useState(false);
  function copy(){
    navigator.clipboard?.writeText(exportText).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false), 2000); });
  }
  function handleImport(){
    try{ onImport(text); onClose(); }
    catch(e){ setError(e.message || 'Unexpected error while importing.'); }
  }
  return (
    <div className="modal-veil" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">
          <h2><Icon name={mode==='export'?'download':'upload'} size={17} style={{color:'var(--arcane)'}}/>{mode==='export'?'Export All Data':'Import Data'}</h2>
          <button className="modal-close" onClick={onClose} aria-label="Close" title={mode==='export' ? 'Close this window' : 'Close without importing'}><Icon name="x" size={18}/></button>
        </div>
        <div className="modal-body">
          {mode==='export' ? (
            <>
              <p style={{fontSize:12.5, color:'var(--parchment-faint)', margin:'0 0 8px'}}>Every encounter tab, your custom monster library, and your custom hazard library, as one block of text. Copy it and save it somewhere (a text file, a note) — on another device, paste it into Import Data to restore everything.</p>
              <textarea readOnly value={exportText} onClick={e=>e.target.select()}/>
            </>
          ) : (
            <>
              <p style={{fontSize:12.5, color:'var(--parchment-faint)', margin:'0 0 8px'}}>Paste a Tactics Table export below. This replaces your current encounters and custom libraries on this device — export first if you want to keep what's here now.</p>
              <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Paste exported data here…"/>
            </>
          )}
          {error && <div className="error-box"><Icon name="alert" size={16}/><p>{error}</p></div>}
        </div>
        <div className="modal-foot">
          <button className="btn" onClick={onClose} title={mode==='export' ? 'Close this window' : 'Close without importing'}>{mode==='export'?'Done':'Cancel'}</button>
          {mode==='export'
            ? <button className="btn btn-arcane" onClick={copy} title="Copy the full export to your clipboard"><Icon name={copied?'check':'copy'} size={15}/>{copied?'Copied!':'Copy to Clipboard'}</button>
            : <button className="btn btn-blood" disabled={!text.trim()} onClick={handleImport} title="Replace everything on this device with the pasted data">Overwrite &amp; Import</button>}
        </div>
      </div>
    </div>
  );
}

function ImportModal({onClose, onImport}){
  const [text, setText] = useState(''); const [error, setError] = useState(null);
  function handleImport(){
    try{ const enc = parseEncounterMarkdown(text); onImport(enc); onClose(); }
    catch(e){ setError(e instanceof MarkdownParseError ? e.message : 'Unexpected error while parsing markdown.'); }

  return (
    <div className="modal-veil" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-head">

const ENCOUNTERS_KEY = 'tactics-table-encounters-v1';
function blankEncounter(name){
  return {
    id: `enc-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, name,
    scene:{environment:'', terrain:'', combatSituation:'', timeOfDay:''}, party:[],
    axes:{ winCondition:{title:'Win Condition — not set yet', description:'Use Draft Axes from Scene, Suggest from Roster, or fill this in by hand.', moraleThresholds:'—'},
           battlefieldOptimizer:{title:'Battlefield Optimizer — not set yet', description:'', mechanicalBenefit:'—'},
           hazardOrClock:{title:'Hazard / Clock — not set yet', initiativeCount:20, triggerEffect:'—'} },
    axesLocked:{win:false, opt:false, hazard:false},
    traitTriggers:[], round:{roundNumber:1, initiativeCount:20, activeCombatantId:null, monsters:[]},
  };
}
function loadEncounterStore(){
  try{
    const raw = localStorage.getItem(ENCOUNTERS_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && Array.isArray(parsed.encounters) && parsed.encounters.length>0) return parsed;
    }
    const old = localStorage.getItem(STORAGE_KEY);
    if(old){
      const enc = JSON.parse(old);
      if(!enc.scene) enc.scene = {environment:'', terrain:'', combatSituation:'', timeOfDay:''};
      return { encounters:[enc], activeId: enc.id };
    }
  }catch(e){}
  return { encounters:[sampleEncounter], activeId: sampleEncounter.id };
}

function EncounterTabs({encounters, activeId, onSelect, onAdd, onDuplicate, onDelete, renamingId, renameValue, onRenameStart, onRenameChange, onRenameCommit}){
  return (
    <div style={{display:'flex', alignItems:'center', gap:6, overflowX:'auto', padding:'10px 20px 0', maxWidth:1360, margin:'0 auto'}}>
      {encounters.map(e=>{
        const isActive = e.id===activeId;
        const isRenaming = renamingId===e.id;
        return (
          <div key={e.id}
            style={{display:'flex', alignItems:'center', gap:6, flexShrink:0, padding:'6px 6px 6px 10px', cursor: isRenaming?'default':'pointer',
              border:'1px solid var(--line)', borderBottom: isActive ? '2px solid var(--blood)' : '1px solid var(--line)',
              background: isActive ? 'var(--panel)' : 'var(--panel-raised)'}}
            onClick={()=>!isRenaming && onSelect(e.id)}
            onDoubleClick={()=>onRenameStart(e.id, e.name)}
            title="Click to switch, double-click to rename">
            {isRenaming ? (
              <input autoFocus value={renameValue} onChange={ev=>onRenameChange(ev.target.value)}
                onClick={ev=>ev.stopPropagation()}
                onBlur={()=>onRenameCommit(e.id)}
                onKeyDown={ev=>{ if(ev.key==='Enter') onRenameCommit(e.id); if(ev.key==='Escape') onRenameCommit(e.id, true); }}
                style={{background:'var(--ink)', border:'1px solid var(--arcane)', color:'var(--parchment)', fontSize:13.5, padding:'2px 5px', width:130}}/>
            ) : (
              <span className="mono" style={{fontSize:13.5, fontWeight: isActive?600:500, color: isActive?'var(--parchment)':'var(--parchment-dim)'}}>{e.name}</span>
            )}
            {!isRenaming && (
              <button className="icon-btn" style={{padding:0}} onClick={ev=>{ev.stopPropagation(); onDuplicate(e.id);}} aria-label={`Duplicate ${e.name}`} title="Duplicate this encounter">
                <Icon name="copy" size={14}/>
              </button>
            )}
            {!isRenaming && encounters.length>1 && (
              <button className="icon-btn" style={{padding:0}} onClick={ev=>{ev.stopPropagation(); onDelete(e.id);}} aria-label={`Delete ${e.name}`} title="Delete this encounter"><Icon name="x" size={14}/></button>
            )}
          </div>
        );
      })}
      <button className="icon-btn" style={{border:'1px dashed var(--line)', padding:'6px 9px', flexShrink:0}} onClick={onAdd} aria-label="New encounter" title="New encounter">
        <Icon name="plus" size={16}/>
      </button>
    </div>
  );
}

function App(){
  const [theme, toggleTheme] = useTheme();
  const [store, setStore] = useState(loadEncounterStore);
  const [customMonsters, setCustomMonsters] = useState(loadCustomMonsters);
  const [customHazards, setCustomHazards] = useState(loadCustomHazards);
  const [importOpen, setImportOpen] = useState(false);
  const [dataModalMode, setDataModalMode] = useState(null); // null | 'export' | 'import'
  const [expandedIds, setExpandedIds] = useState(()=>new Set());
  const [renamingId, setRenamingId] = useState(null);
  const [renameValue, setRenameValue] = useState('');

  function toggleExpanded(id){ setExpandedIds(prev=>{ const next = new Set(prev); next.has(id) ? next.delete(id) : next.add(id); return next; }); }
  function expand(id){ setExpandedIds(prev=>{ const next = new Set(prev); next.add(id); return next; }); }

  useEffect(()=>{ try{ localStorage.setItem(ENCOUNTERS_KEY, JSON.stringify(store)); }catch(e){} }, [store]);
  useEffect(()=>{ saveCustomMonsters(customMonsters); }, [customMonsters]);
  useEffect(()=>{ saveCustomHazards(customHazards); }, [customHazards]);

  const encounter = store.encounters.find(e=>e.id===store.activeId) || store.encounters[0];
  function updateActive(fn){ setStore(s=>({...s, encounters: s.encounters.map(e=> e.id===s.activeId ? fn(e) : e)})); }

  function addEncounterTab(){
    const enc = blankEncounter(`Encounter ${store.encounters.length+1}`);
    enc.party = JSON.parse(JSON.stringify(encounter.party));
    setStore(s=>({encounters:[...s.encounters, enc], activeId: enc.id}));
    setRenamingId(enc.id); setRenameValue(enc.name);
  }
  function selectEncounterTab(id){ setStore(s=>({...s, activeId:id})); }
  function duplicateEncounterTab(id){
    setStore(s=>{
      const source = s.encounters.find(e=>e.id===id);
      if(!source) return s;
      const clone = { ...JSON.parse(JSON.stringify(source)), id: `enc-${Date.now()}-${Math.random().toString(36).slice(2,7)}`, name: `${source.name} (Copy)` };
      const idx = s.encounters.findIndex(e=>e.id===id);
      const encounters = [...s.encounters.slice(0, idx+1), clone, ...s.encounters.slice(idx+1)];
      return { encounters, activeId: clone.id };
    });
  }
  function deleteEncounterTab(id){
    setStore(s=>{
      if(s.encounters.length<=1) return s;
      const encounters = s.encounters.filter(e=>e.id!==id);
      const activeId = s.activeId===id ? encounters[0].id : s.activeId;
      return {encounters, activeId};
    });
  }
  function startRename(id, name){ setRenamingId(id); setRenameValue(name); }
  function commitRename(id, cancel){
    if(!cancel) setStore(s=>({...s, encounters: s.encounters.map(e=> e.id===id ? {...e, name: renameValue.trim() || e.name} : e)}));
    setRenamingId(null);
  }

  function addCustomMonster(template){ setCustomMonsters(list=>[...list.filter(m=>m.name.toLowerCase()!==template.name.toLowerCase()), template]); }
  function removeCustomMonster(name){ setCustomMonsters(list=>list.filter(m=>m.name!==name)); }

  function updateMonsterHp(id, delta){
    updateActive(enc=>({...enc, round:{...enc.round, monsters:enc.round.monsters.map(m=>{
      if(m.id!==id) return m;
      const hpCurrent = Math.max(0, Math.min(m.hpMax, m.hpCurrent+delta));
      const next = {...m, hpCurrent, isDefeated: hpCurrent<=0};
      return {...next, activePosture: computeAutoPosture(next)};
    })}}));
  }
  function setMonsterPosture(id, posture){ updateActive(enc=>({...enc, round:{...enc.round, monsters:enc.round.monsters.map(m=> m.id===id ? {...m, activePosture:posture} : m)}})); }
  function setMonsterStats(id, patch){
    updateActive(enc=>({...enc, round:{...enc.round, monsters:enc.round.monsters.map(m=>{
      if(m.id!==id) return m;
      const next = {...m, ...patch};
      next.hpMax = Math.max(1, next.hpMax);
      next.hpCurrent = Math.max(0, Math.min(next.hpMax, next.hpCurrent));
      next.isDefeated = next.hpCurrent <= 0;
      return {...next, activePosture: computeAutoPosture(next)};
    })}}));
  }
  function toggleDefeated(id){ updateActive(enc=>({...enc, round:{...enc.round, monsters:enc.round.monsters.map(m=> m.id===id ? {...m, isDefeated:!m.isDefeated} : m)}})); }
  function updatePartyHp(id, delta){ updateActive(enc=>({...enc, party:enc.party.map(p=> p.id===id ? {...p, hpCurrent:Math.max(0,Math.min(p.hpMax,p.hpCurrent+delta))} : p)})); }
  function addPartyMember(member){ updateActive(enc=>({...enc, party:[...enc.party, member]})); }
  function removePartyMember(id){ updateActive(enc=>({...enc, party:enc.party.filter(p=>p.id!==id)})); }
  function addMonster(monster){ updateActive(enc=>({...enc, round:{...enc.round, monsters:[...enc.round.monsters, monster]}})); expand(monster.id); }
  function removeMonster(id){
    updateActive(enc=>{
      const monsters = enc.round.monsters.filter(m=>m.id!==id);
      const activeCombatantId = enc.round.activeCombatantId === id ? null : enc.round.activeCombatantId;
      return {...enc, round:{...enc.round, monsters, activeCombatantId}};
    });
  }
  function setInitiative(kind, id, value){
    const n = Number(value) || 0;
    if(kind === 'pc') updateActive(enc=>({...enc, party: enc.party.map(p=> p.id===id ? {...p, initiative:n} : p)}));
    else updateActive(enc=>({...enc, round:{...enc.round, monsters: enc.round.monsters.map(m=> m.id===id ? {...m, initiative:n} : m)}}));
  }
  function setPartyAc(id, ac){ updateActive(enc=>({...enc, party: enc.party.map(p=> p.id===id ? {...p, ac} : p)})); }
  function setPartyLevel(id, level){ updateActive(enc=>({...enc, party: enc.party.map(p=> p.id===id ? {...p, level} : p)})); }
  function toggleCondition(kind, id, condition){
    const flip = (list)=> (list||[]).includes(condition) ? list.filter(c=>c!==condition) : [...(list||[]), condition];
    if(kind === 'pc') updateActive(enc=>({...enc, party: enc.party.map(p=> p.id===id ? {...p, conditions: flip(p.conditions)} : p)}));
    else updateActive(enc=>({...enc, round:{...enc.round, monsters: enc.round.monsters.map(m=> m.id===id ? {...m, conditions: flip(m.conditions)} : m)}}));
  }
  function setScene(patch){ updateActive(enc=>({...enc, scene:{...enc.scene, ...patch}})); }
  function getLocks(enc){ return enc.axesLocked || {win:false, opt:false, hazard:false}; }
  function setAxes(axes){
    updateActive(enc=>{
      const locked = getLocks(enc);
      return {...enc, axes:{
        winCondition: locked.win ? enc.axes.winCondition : axes.winCondition,
        battlefieldOptimizer: locked.opt ? enc.axes.battlefieldOptimizer : axes.battlefieldOptimizer,
        hazardOrClock: locked.hazard ? enc.axes.hazardOrClock : axes.hazardOrClock,
      }};
    });
  }
  function handleGenerateEncounter(){
    updateActive(enc => {
      const locked = getLocks(enc);
      const drafted = suggestAxes(enc.round.monsters, enc.scene);
      return {...enc, axes:{
        winCondition: locked.win ? enc.axes.winCondition : drafted.winCondition,
        battlefieldOptimizer: locked.opt ? enc.axes.battlefieldOptimizer : drafted.battlefieldOptimizer,
        hazardOrClock: locked.hazard ? enc.axes.hazardOrClock : drafted.hazardOrClock,
      }};
    });
  }
  function applyHazard(hazard){ updateActive(enc=> getLocks(enc).hazard ? enc : ({...enc, axes:{...enc.axes, hazardOrClock: hazard}})); }
  function addCustomHazard(hazard){ setCustomHazards(list=>[...list.filter(h=>h.title.toLowerCase()!==hazard.title.toLowerCase()), hazard]); }
  function removeCustomHazard(title){ setCustomHazards(list=>list.filter(h=>h.title!==title)); }
  function toggleAxisLock(key){ updateActive(enc=>({...enc, axesLocked:{...getLocks(enc), [key]: !getLocks(enc)[key]}})); }
  function buildExportPayload(){
    return JSON.stringify({tacticsTableExport:1, exportedAt:new Date().toISOString(), store, customMonsters, customHazards}, null, 2);
  }
  function applyImportedData(jsonText){
    const data = JSON.parse(jsonText);
    if(!data || typeof data !== 'object' || !data.store || !Array.isArray(data.store.encounters) || data.store.encounters.length===0){
      throw new Error('This doesn\'t look like a Tactics Table export — expected a "store" with at least one encounter.');
    }
    setStore(data.store);
    if(Array.isArray(data.customMonsters)) setCustomMonsters(data.customMonsters);
    if(Array.isArray(data.customHazards)) setCustomHazards(data.customHazards);
  }
  function rollCombatMenu(){
    const obj = COMBAT_OBJECTIVES[Math.floor(Math.random()*COMBAT_OBJECTIVES.length)];
    const opt = COMBAT_OPTIMIZERS[Math.floor(Math.random()*COMBAT_OPTIMIZERS.length)];
    updateActive(enc=>{
      const locked = getLocks(enc);
      return {...enc, axes:{...enc.axes,
        winCondition: locked.win ? enc.axes.winCondition : {title:obj.title, description:obj.description, moraleThresholds:obj.moraleThresholds},
        battlefieldOptimizer: locked.opt ? enc.axes.battlefieldOptimizer : {title:opt.title, description:opt.description, mechanicalBenefit:opt.mechanicalBenefit},
      }};
    });
  }
  function rollWinCondition(){
    updateActive(enc=>{
      if(getLocks(enc).win) return enc;
      const obj = COMBAT_OBJECTIVES[Math.floor(Math.random()*COMBAT_OBJECTIVES.length)];
      return {...enc, axes:{...enc.axes, winCondition:{title:obj.title, description:obj.description, moraleThresholds:obj.moraleThresholds}}};
    });
  }
  function rollBattlefieldOptimizer(){
    updateActive(enc=>{
      if(getLocks(enc).opt) return enc;
      const opt = COMBAT_OPTIMIZERS[Math.floor(Math.random()*COMBAT_OPTIMIZERS.length)];
      return {...enc, axes:{...enc.axes, battlefieldOptimizer:{title:opt.title, description:opt.description, mechanicalBenefit:opt.mechanicalBenefit}}};
    });
  }
  function nextTurn(){
    updateActive(enc=>{
      const order = getTurnOrder(enc);
      if(order.length === 0) return enc;
      const curIdx = order.findIndex(c=>c.id === enc.round.activeCombatantId);
      const nextIdx = curIdx === -1 ? 0 : (curIdx + 1) % order.length;
      const wrapped = curIdx !== -1 && nextIdx === 0;
      const next = order[nextIdx];
      if(next.kind === 'monster') expand(next.id);
      return {...enc, round:{...enc.round, activeCombatantId: next.id, roundNumber: wrapped ? enc.round.roundNumber + 1 : enc.round.roundNumber}};
    });
  }
  function nextRound(){
    updateActive(enc=>{
      const order = getTurnOrder(enc);
      return {...enc, round:{...enc.round, roundNumber:enc.round.roundNumber+1, activeCombatantId: order[0]?.id ?? null}};
    });
  }
  function prevRound(){
    updateActive(enc=>{
      const order = getTurnOrder(enc);
      return {...enc, round:{...enc.round, roundNumber: Math.max(1, enc.round.roundNumber-1), activeCombatantId: order[0]?.id ?? null}};
    });
  }
  function resetRound(){
    updateActive(enc=>{
      const order = getTurnOrder(enc);
      return {...enc, round:{...enc.round, roundNumber:1, activeCombatantId: order[0]?.id ?? null}};
    });
  }
  function importEncounter(imported){ updateActive(enc=>({...imported, id: enc.id})); }

  const turnOrder = getTurnOrder(encounter);
  const activeCombatant = turnOrder.find(c=>c.id === encounter.round.activeCombatantId) ?? turnOrder[0];
  const activeMonster = activeCombatant?.kind === 'monster' ? encounter.round.monsters.find(m=>m.id===activeCombatant.id) : undefined;

  return (
    <React.Fragment>
      <div className="topbar">
        <div className="topbar-inner">
          <div className="brand">
            <Icon name="blade" size={26} style={{color:'var(--blood)'}}/>
            <div><h1>Tactics Table</h1><p>{encounter.name}</p></div>
          </div>
          <div className="topbar-actions">
            <button className="icon-toggle" onClick={toggleTheme} aria-label="Toggle light/dark theme" title="Toggle light/dark theme">
              <Icon name={theme==='dark' ? 'sun' : 'moon'} size={17}/>
            </button>
            <button className="btn" onClick={()=>setDataModalMode('export')} title="Copy every encounter, custom monster, and custom hazard on this device as one block of text"><Icon name="download" size={15}/>Export Data</button>
            <button className="btn" onClick={()=>setDataModalMode('import')} title="Paste back a previous export, overwriting what's on this device"><Icon name="upload" size={15}/>Import Data</button>
            <button className="btn" onClick={()=>setImportOpen(true)} title="Load one full encounter from raw markdown text"><Icon name="upload" size={15}/>Import Markdown</button>
          </div>
        </div>
        <EncounterTabs encounters={store.encounters} activeId={store.activeId} onSelect={selectEncounterTab} onAdd={addEncounterTab} onDuplicate={duplicateEncounterTab} onDelete={deleteEncounterTab}
          renamingId={renamingId} renameValue={renameValue} onRenameStart={startRename} onRenameChange={setRenameValue} onRenameCommit={commitRename}/>
      </div>

      {importOpen && <ImportModal onClose={()=>setImportOpen(false)} onImport={importEncounter}/>}
      {dataModalMode && <DataModal mode={dataModalMode} exportText={dataModalMode==='export' ? buildExportPayload() : ''} onImport={applyImportedData} onClose={()=>setDataModalMode(null)}/>}

      <div className="shell">
        <HowToUseSection/>
        <AxesStrip axes={encounter.axes} monsters={encounter.round.monsters} scene={encounter.scene} onSuggest={setAxes} onSceneChange={setScene} onGenerate={handleGenerateEncounter}
          onRollCombatMenu={rollCombatMenu} onRollWinCondition={rollWinCondition} onRollBattlefieldOptimizer={rollBattlefieldOptimizer}
          locked={encounter.axesLocked || {win:false,opt:false,hazard:false}} onToggleLock={toggleAxisLock}
          customHazards={customHazards} onApplyHazard={applyHazard} onSaveCustomHazard={addCustomHazard} onRemoveCustomHazard={removeCustomHazard}/>
        <RoundTracker round={encounter.round} order={turnOrder} party={encounter.party} onNextTurn={nextTurn} onPrevRound={prevRound} onNextRound={nextRound} onReset={resetRound} onRemoveMonster={removeMonster}/>
        <div className="main-grid">
          <div className="stack">
            <PartyPanel party={encounter.party} onDelta={updatePartyHp} onAdd={addPartyMember} onRemove={removePartyMember} onSetInitiative={(id,v)=>setInitiative('pc', id, v)} onSetAc={setPartyAc} onSetLevel={setPartyLevel} onToggleCondition={(id,c)=>toggleCondition('pc', id, c)}/>
          </div>
          <div className="stack">
            <AddMonsterForm onAdd={addMonster} customMonsters={customMonsters} onSaveCustom={addCustomMonster} onRemoveCustom={removeCustomMonster}/>
            <div className="monster-grid">
              {encounter.round.monsters.map(m=>(
                <MonsterCard key={m.id} monster={m} isActiveTurn={activeMonster && activeMonster.id===m.id}
                  expanded={expandedIds.has(m.id)} onToggleExpand={()=>toggleExpanded(m.id)}
                  onDelta={updateMonsterHp} onPosture={setMonsterPosture} onToggleDefeated={toggleDefeated} onRemove={removeMonster} onSetStats={setMonsterStats}
                  traitTriggers={encounter.traitTriggers} axes={encounter.axes} onToggleCondition={(id,c)=>toggleCondition('monster', id, c)}
                  party={encounter.party} onDamageParty={updatePartyHp}/>
              ))}
            </div>
          </div>
        </div>
      </div>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
